/* ---------- progress ---------- */
let done=new Set(store.get('done')||[]);
const allSteps=[];MODS.forEach((m,i)=>m.s.forEach((s,j)=>allSteps.push(i+'-'+j)));
function markDone(k){done.add(k);store.set('done',[...done]);updProg()}
function updProg(){const n=allSteps.filter(k=>done.has(k)).length,p=Math.round(n/allSteps.length*100);document.getElementById('pfill').style.width=p+'%';document.getElementById('ptxt').textContent=p+'%';renderNav()}

/* ---------- code display ---------- */
function hl(code){
 return code.split('\n').map(line=>{
  let out='',inS=null,i=0,buf='';
  const flush=c=>{out+=c?`<span class="${c}">${esc(buf)}</span>`:esc(buf);buf=''};
  for(;i<line.length;i++){const ch=line[i];
   if(inS){buf+=ch;if(ch===inS){flush('s');inS=null}}
   else if(ch==='"'||ch==="'"){flush('');inS=ch;buf=ch}
   else if(ch==='#'){flush('');buf=line.slice(i);flush('c');break}
   else buf+=ch}
  flush(inS?'s':'');return out}).join('\n');
}

/* ---------- Python engine ---------- */
let pyP=null;
const PYV='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
function getPy(){
 if(pyP)return pyP;
 pyP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=PYV+'pyodide.js';
  sc.onload=()=>{loadPyodide({indexURL:PYV}).then(res,rej)};sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)});
 pyP.catch(()=>{pyP=null});return pyP;
}
async function runPy(prev,code){
 const py=await getPy();let buf='';
 py.setStdout({batched:s=>{buf+=s+'\n'}});py.setStderr({batched:s=>{buf+=s+'\n'}});
 const g=py.globals.get('dict')();
 try{
  if(prev.trim()){py.runPython(prev,{globals:g});buf=''}
  py.runPython(code,{globals:g});return {ok:true,out:buf};
 }catch(e){return {ok:false,out:buf,err:String(e.message||e)}}
 finally{g.destroy()}
}
function friendly(err){
 const lines=err.trim().split('\n').filter(Boolean),last=lines[lines.length-1]||err;
 let ln='';for(const l of lines){const m=l.match(/File "<exec>", line (\d+)/);if(m)ln=m[1]}
 const kind=(last.match(/^(\w+Error)/)||[])[1];
 const hint=L(ERR[kind]||ERR.other);
 const where=ln?(lang==='zh'?`（第 ${ln} 行）`:lang==='ne'?` (लाइन ${ln})`:` (line ${ln})`):'';
 return `<span class="e">${esc(L(UI.errHead))}\n\n${esc(last)}${esc(where)}\n\n${esc(hint)}</span>`;
}
async function doRun(outEl,prev,code,fallback){
 outEl.textContent=L(UI.loading);
 try{const r=await runPy(prev,code);
  if(r.ok){outEl.textContent=r.out.trim()?r.out.replace(/\n$/,''):L(UI.noOut);return true}
  outEl.innerHTML=(r.out?esc(r.out)+'\n':'')+friendly(r.err);return false;
 }catch(e){outEl.textContent=L(UI.noPy)+(fallback?'\n\n'+fallback:'');return null}
}

/* ---------- checking ---------- */
const norm=s=>s.replace(/\r/g,'').replace(/\t/g,'    ').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()!=='');
function check(typed,want){
 const a=norm(typed),b=norm(want);
 if(!a.length)return {ok:false,msg:L(UI.empty)};
 const q=l=>l.replace(/'/g,'"').replace(/\s*([=,:()\[\]{}+*\/<>-])\s*/g,'$1');
 for(let i=0;i<b.length;i++){
  if(a[i]===undefined)return {ok:false,line:i+1,want:b[i],got:L(UI.missing)};
  if(q(a[i])!==q(b[i])||a[i].match(/^ */)[0].length!==b[i].match(/^ */)[0].length)
   return {ok:false,line:i+1,want:b[i],got:a[i],ind:a[i].match(/^ */)[0].length!==b[i].match(/^ */)[0].length};
 }
 if(a.length>b.length)return {ok:false,msg:L(UI.extra)};
 return {ok:true};
}

/* ---------- lesson view ---------- */
let cur=0;
function renderNav(){
 document.getElementById('nav').innerHTML=MODS.map((m,i)=>{const full=m.s.every((s,j)=>done.has(i+'-'+j));
  return (LEVELS.some(x=>x[0]===i)?`<div class="trackhead">${esc(L(levelOf(i)[1]))}</div>`:'')+`<a href="#lesson-${i}" ${i===cur?'aria-current="true"':''}><b>${String(i).padStart(2,'0')}</b><span class="t">${esc(L(m.t))}</span><i class="dot${full?' full':''}"></i></a>`}).join('');
}
const prevCode=(mi,sj)=>[MODS[mi].pre||'',...MODS[mi].s.slice(0,sj).map(s=>s.code||'')].join('\n\n');
function renderLesson(i){
 cur=i;const m=MODS[i];
 const head=`${L(UI.lesson)} ${i}${L(UI.lessonSuf)}`;
 let h=`<span class="tag">${esc(L(levelOf(i)[1]))}</span><h2>${esc(head)} · ${esc(L(m.t))}</h2><p class="lead">${esc(L(m.d))}</p>`+lessonPic(i);
 if(m.pre)h+=`<details class="pre box"><summary class="boxhead">${esc(L(UI.earlier))}</summary><pre class="src">${hl(m.pre)}</pre></details>`;
 h+=m.s.map((s,j)=>{const k=i+'-'+j,isDone=done.has(k);
  let b=`<article class="step" id="st-${k}"><h3><span class="n">${j+1}</span><span>${esc(L(s.t))}</span>${isDone?`<span class="ok">✓ ${esc(L(UI.done))}</span>`:''}</h3><div class="x">${L(s.x)}</div>`;
  if(s.code){
   b+=`<div class="box"><div class="boxhead"><span>${esc(s.local?L(UI.runsHere):L(UI.code))}</span><button class="small" data-act="copy" data-k="${k}">${esc(L(UI.copy))}</button></div><pre class="src">${hl(s.code)}</pre>`;
   if(!s.local){
    const saved=store.get('typed.'+k)||'';
    b+=`<label class="boxhead" for="ta-${k}" style="background:var(--con2)">${esc(L(UI.type))}</label><textarea class="code" id="ta-${k}" data-k="${k}" spellcheck="false" autocapitalize="off" autocomplete="off" rows="${Math.max(3,s.code.split('\n').length+1)}">${esc(saved)}</textarea>
    <div class="btns"><button class="btn" data-act="check" data-k="${k}">${esc(L(UI.check))}</button><button class="btn pri" data-act="run" data-k="${k}">▶ ${esc(L(UI.run))}</button><button class="btn" data-act="answer" data-k="${k}">${esc(L(UI.answer))}</button></div>
    <div class="fb" id="fb-${k}" role="status"></div><pre class="out" id="out-${k}" aria-live="polite"></pre>`;
   }
   b+=`</div>`;
  }
  if(!s.code||s.local)b+=`<div style="margin-top:14px"><button class="btn${isDone?'':' pri'}" data-act="ok" data-k="${k}">${isDone?'✓ ':''}${esc(L(UI.understood))}</button></div>`;
  return b+`</article>`}).join('');
 h+=`<div class="pager">${i>0?`<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="#lesson-${i-1}">${esc(L(UI.prev))}</a>`:'<span></span>'}${i<MODS.length-1?`<a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="#lesson-${i+1}">${esc(L(UI.next))}</a>`:''}</div>`;
 document.getElementById('lesson').innerHTML=h;renderNav();
}
const stepOf=k=>{const [i,j]=k.split('-').map(Number);return {i,j,s:MODS[i].s[j]}};

document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-act]');if(!btn)return;
 const act=btn.dataset.act,k=btn.dataset.k;
 if(act==='play'){const out=document.getElementById('pout');doRun(out,'',document.getElementById('pta').value,'');return}
 const {i,j,s}=stepOf(k);
 const ta=document.getElementById('ta-'+k),fb=document.getElementById('fb-'+k),out=document.getElementById('out-'+k);
 if(act==='copy'){try{await navigator.clipboard.writeText(s.code);btn.textContent=L(UI.copied);setTimeout(()=>btn.textContent=L(UI.copy),1500)}catch(err){}return}
 if(act==='ok'){markDone(k);renderLesson(i);return}
 if(act==='answer'){ta.value=s.code;store.set('typed.'+k,s.code);ta.focus();return}
 if(act==='check'){const r=check(ta.value,s.code);
  if(r.ok){fb.className='fb good';fb.textContent='✓ '+L(UI.right);markDone(k);return}
  fb.className='fb bad';
  fb.innerHTML=r.msg?esc(r.msg):`${esc(L(UI.wrongLine))} ${r.line}${esc(L(UI.wrongLineSuf))}<br>${esc(L(UI.expected))}<pre>${esc(r.want)}</pre>${esc(L(UI.you))}<pre>${esc(r.got)}</pre>${r.ind?esc(L(UI.spaces)):''}`;return}
 if(act==='run'){const code=ta.value.trim()?ta.value:s.code;const ok=await doRun(out,prevCode(i,j),code,s.out);
  if(ok&&ta.value.trim()&&check(ta.value,s.code).ok)markDone(k);}
});
document.addEventListener('input',e=>{if(e.target.matches('textarea[data-k]'))store.set('typed.'+e.target.dataset.k,e.target.value);if(e.target.id==='pta')store.set('play',e.target.value);if(e.target.id==='gq')renderGloss(e.target.value)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Tab'&&!e.shiftKey&&t.matches('textarea.code')){e.preventDefault();const a=t.selectionStart;t.setRangeText('    ',a,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}
 else if(e.key==='Enter'&&t.matches('textarea.code')&&!e.ctrlKey&&!e.metaKey){const a=t.selectionStart,before=t.value.slice(0,a),line=before.slice(before.lastIndexOf('\n')+1);let ind=line.match(/^ */)[0];if(/:\s*$/.test(line))ind+='    ';if(ind){e.preventDefault();t.setRangeText('\n'+ind,a,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}}
 else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&t.matches('textarea.code')){e.preventDefault();const b=t.id==='pta'?document.querySelector('[data-act=play]'):document.querySelector(`[data-act=run][data-k="${t.dataset.k}"]`);b&&b.click()}});

/* ---------- other views ---------- */
function renderPlay(){
 const v=document.getElementById('v-playground');
 const start=store.get('play')||`# Change anything and press Run (Ctrl+Enter)\nname = "Sathi"\nfor i in range(3):\n    print(f"{i + 1}. Hello from {name}!")`;
 v.innerHTML=`<h2>${esc(L(UI.playH))}</h2><p class="lead">${esc(L(UI.playP))}</p><div class="box"><textarea class="code" id="pta" spellcheck="false" rows="14" style="border-top:0">${esc(start)}</textarea><div class="btns"><button class="btn pri" data-act="play">▶ ${esc(L(UI.run))}</button></div><pre class="out" id="pout" aria-live="polite"></pre></div>`;
}
function renderGloss(q=''){
 const v=document.getElementById('v-glossary');
 if(!v.querySelector('#gq'))v.innerHTML=`<h2>${esc(L(UI.glossH))}</h2><input class="search" id="gq" type="search" placeholder="${esc(L(UI.search))}" aria-label="${esc(L(UI.search))}"><div class="gl" id="gl"></div>`;
 const s=q.trim().toLowerCase();
 const list=GLOSS.filter(g=>!s||[...Object.values(g.w),...Object.values(g.d)].join(' ').toLowerCase().includes(s));
 const others=g=>['en','ne','zh'].filter(x=>x!==lang).map(x=>g.w[x]).filter((x,ix,a)=>x!==g.w[lang]&&a.indexOf(x)===ix).join(' · ');
 document.getElementById('gl').innerHTML=list.map(g=>`<article><h3>${esc(L(g.w))}</h3><p class="alt">${esc(others(g))}</p><p>${esc(L(g.d))}</p></article>`).join('');
}
function renderRes(){
 document.getElementById('v-resources').innerHTML=`<h2>${esc(L(UI.resH))}</h2><p class="lead">${esc(L(UI.resP))}</p><div class="res">${RES.map(([h,items])=>`<h3>${esc(L(h))}</h3>`+items.map(r=>`<a href="${r.u}" target="_blank" rel="noopener"><b>${esc(r.t)}</b><small>${esc(r.u.replace(/^https:\/\//,''))}</small>${esc(L(r.d))}</a>`).join('')).join('')}</div>`;
}

/* ---------- routing + language ---------- */
function route(){
 const h=location.hash.slice(1)||'lesson-0';let tab='lesson';
 if(h==='playground'||h==='glossary'||h==='resources')tab=h;
 for(const id of ['lesson','playground','glossary','resources'])document.getElementById('v-'+id).hidden=id!==tab;
 for(const a of document.querySelectorAll('.tabs a')){a.toggleAttribute('aria-current',a.dataset.tab===tab);if(a.dataset.tab===tab)a.setAttribute('aria-current','page')}
 document.querySelector('.tabs a[data-tab=lesson]').href='#lesson-'+cur;
 if(tab==='lesson'){const n=Math.min(MODS.length-1,Math.max(0,parseInt(h.split('-')[1])||0));renderLesson(n);document.querySelector('.tabs a[data-tab=lesson]').href='#lesson-'+n}
 if(tab==='playground'&&!document.getElementById('pta'))renderPlay();
 if(tab==='glossary')renderGloss(document.getElementById('gq')?.value||'');
 if(tab==='resources')renderRes();
}
function setLang(l){
 lang=l;store.set('lang',l);document.documentElement.lang=l==='zh'?'zh-Hans':l;
 for(const b of document.querySelectorAll('[data-lang]'))b.setAttribute('aria-pressed',b.dataset.lang===l);
 for(const el of document.querySelectorAll('[data-ui]'))el.textContent=L(UI[el.dataset.ui]);
 drawPic();renderSwatches();
 document.getElementById('v-playground').innerHTML='';document.getElementById('v-glossary').innerHTML='';
 route();
}
for(const b of document.querySelectorAll('[data-lang]'))b.addEventListener('click',()=>setLang(b.dataset.lang));
window.addEventListener('hashchange',()=>{route();if(location.hash.startsWith('#lesson'))document.getElementById('lesson').scrollIntoView({block:'start'})});
setLang(lang);updProg();
}
