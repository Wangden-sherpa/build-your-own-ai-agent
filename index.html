<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Own AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* VOICE: patient teacher, calm and clear, for total beginners
   IDEA: an architect's workbook — each lesson a drawn plate you build line by line
   PICTURE: a 3D drawing of the agent: You → Brain → Tools → Memory, in a loop
   COLOUR and TYPE: white, black, concrete planes, one safety-yellow accent; Hanken Grotesk + Noto for नेपाली / 中文
   LAYOUT: modest title, big drawing, then a lesson list and one lesson at a time */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a1a19);--ink:light-dark(#141414,#ecebe6);--mut:light-dark(#5b5b57,#a7a6a0);--con:light-dark(#d8d8d4,#2b2b29);--con2:light-dark(#ececea,#232322);--line:light-dark(#141414,#ecebe6);--acc:#ffe600;--ok:light-dark(#0b6b2e,#7ee09c);--bad:light-dark(#b3141b,#ff8a8a);--code:light-dark(#f4f4f1,#121211)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Hanken Grotesk","Noto Sans Devanagari","Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
:lang(ne) body,html[lang=ne] body{line-height:1.75}
a{color:inherit}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}html{scroll-padding-top:80px}
code,pre,textarea.code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px max(5vw,16px)}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:18px;height:18px;background:var(--acc);border:2px solid #141414}
.langs{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{min-height:44px;padding:0 14px;border:2px solid var(--line);background:transparent;font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible,.nav a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.prog .track{width:120px;height:10px;background:var(--con);position:relative}
.prog .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);width:0}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);align-items:center;background:var(--con2)}
.hero h1{font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 16px;text-wrap:balance;font-weight:700}
.hero p{margin:0 0 14px;max-width:62ch}
.note{font-size:14px;color:var(--mut);border-left:3px solid var(--acc);padding-left:12px}
.fig{position:relative;min-height:340px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);padding:0 max(5vw,16px);flex-wrap:wrap}
.tabs a{min-height:48px;display:flex;align-items:center;padding:0 18px;text-decoration:none;font-weight:600;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs a[aria-current=page]{border-bottom-color:var(--acc);background:var(--con2)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px;align-items:start}
.nav{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto}
.nav a{display:grid;grid-template-columns:34px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:9px 10px;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nav a b{font-variant-numeric:tabular-nums;color:var(--mut)}
.nav a[aria-current=true]{border-left-color:var(--ink);background:var(--con2);font-weight:600}
.nav a .dot{width:12px;height:12px;border:2px solid var(--mut)}
.nav a .dot.full{background:var(--acc);border-color:#141414}
h2{font-size:clamp(28px,3.4vw,38px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 28px;max-width:68ch}
.step{border-top:2px solid var(--line);padding:24px 0 30px}
.step h3{font-size:22px;margin:0 0 10px;line-height:1.25;display:flex;gap:12px;align-items:baseline}
.step h3 span.n{flex:none;background:var(--acc);color:#141414;font-size:15px;padding:2px 9px;font-weight:700}
.step h3 .ok{font-size:14px;color:var(--ok);font-weight:600;margin-left:auto;flex:none}
.x{max-width:72ch}.x p{margin:0 0 12px}.x code{background:var(--code);padding:1px 5px;font-size:.92em}
.x ul{margin:0 0 12px;padding-left:22px}.x li{margin-bottom:6px}
.box{border:2px solid var(--line);margin-top:16px}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--con);font-size:14px;font-weight:600;flex-wrap:wrap}
pre.src{margin:0;padding:14px 16px;background:var(--code);font-size:15px;line-height:1.6;tab-size:4}
pre.src .s{color:light-dark(#8a4b00,#ffd27a)}pre.src .c{color:var(--mut);font-style:italic}
.small{min-height:36px;padding:0 12px;border:2px solid var(--line);background:var(--bg);font-size:14px;font-weight:600}
textarea.code{width:100%;min-height:110px;padding:12px 14px;font-size:16px;line-height:1.6;border:0;border-top:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;tab-size:4;display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-top:2px solid var(--line);background:var(--con2)}
.btn{min-height:44px;padding:0 18px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:15px}
.btn.pri{background:var(--acc);color:#141414;border-color:#141414}
.fb{padding:0 12px;font-size:15px}.fb:not(:empty){padding:10px 12px;border-top:2px solid var(--line)}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
.fb pre{margin:6px 0 0;padding:8px;background:var(--code);color:var(--ink);font-size:14px}
pre.out{margin:0;padding:12px 14px;background:#141414;color:#e9f5d6;font-size:15px;min-height:0;white-space:pre-wrap}
pre.out:empty{display:none}
pre.out .e{color:#ff9d9d}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.pre{margin:0 0 18px}.pre summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.gl article{border:2px solid var(--line);padding:16px}
.gl h3{margin:0 0 6px;font-size:19px}.gl .alt{font-size:14px;color:var(--mut);margin:0 0 8px}
.gl p{margin:0;font-size:16px}
input.search{width:100%;max-width:520px;min-height:48px;padding:0 14px;font-size:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:20px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}
.res a{display:block;border:2px solid var(--line);padding:16px;text-decoration:none}
.res a:hover{background:var(--con2)}.res b{display:block;font-size:18px}.res small{color:var(--mut);display:block;margin:2px 0 8px;overflow-wrap:anywhere}
.res h3{grid-column:1/-1;margin:16px 0 0;font-size:20px}
footer{border-top:2px solid var(--line);font-size:14px;color:var(--mut)}
[hidden]{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.nav{position:static;max-height:none;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}.nav a{flex:none;grid-template-columns:auto auto 14px;border:2px solid var(--con)}.nav a span.t{display:none}.nav a[aria-current=true] span.t{display:inline}}
@media(max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}.fig{min-height:260px}.prog .track{width:70px}}
/* lesson pictures */
.lpic{position:relative;margin:0 0 26px;border:2px solid var(--line);background:#f4f3ef;line-height:0}
.lpic svg{width:100%;height:auto;display:block}
.lpbtn{position:absolute;right:10px;bottom:10px;line-height:1;background:#fff;color:#141414;border-color:#141414}
.lpic .a-bob{animation:bob 2.6s ease-in-out infinite}
.lpic .a-slide{animation:slide 3s ease-in-out infinite}
.lpic .a-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-in-out infinite}
.lpic .a-spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
.lpic .a-flow{stroke-dasharray:9 7;animation:flow 1.1s linear infinite}
.lpic .a-blink{animation:blink 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes slide{50%{transform:translateX(12px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes blink{50%{opacity:.25}}
@media(max-width:600px){.lpbtn{position:static;display:block;margin:6px 6px 6px auto}}
.lpic.paused *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.lpic *{animation:none!important}}
/* backgrounds */
#bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat}
html{--veilp:88%}
html.has-bg body{background:transparent}
html.has-bg header,html.has-bg .tabs,html.has-bg footer{background:color-mix(in srgb,var(--bg) var(--veilp),transparent);backdrop-filter:blur(8px)}
html.has-bg .hero{background:color-mix(in srgb,var(--con2) var(--veilp),transparent);backdrop-filter:blur(8px)}
html.has-bg main>.wrap{background:color-mix(in srgb,var(--bg) var(--veilp),transparent);backdrop-filter:blur(8px);padding:clamp(16px,3vw,36px);border:2px solid var(--line)}
.tools-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bgPanel{position:fixed;z-index:20;top:70px;right:max(2vw,8px);width:min(440px,96vw);max-height:calc(100vh - 90px);overflow:auto;background:var(--bg);border:2px solid var(--line);box-shadow:8px 8px 0 var(--con);padding:18px}
#bgPanel h2{font-size:24px;margin:0 0 4px}#bgPanel p{margin:0 0 14px;font-size:15px;color:var(--mut)}
.sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sw button{border:2px solid var(--line);background:var(--bg);padding:0;text-align:start;font-size:13px;font-weight:600}
.sw button i{display:block;height:64px;background-size:cover;background-position:center;border-bottom:2px solid var(--line)}
.sw button span{display:block;padding:6px 8px;min-height:34px}
.sw button[aria-pressed=true]{outline:4px solid var(--acc);outline-offset:1px}
.field{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px;font-size:15px;font-weight:600}
.field input[type=color]{width:56px;height:44px;border:2px solid var(--line);padding:2px;background:var(--bg)}
.field input[type=range]{flex:1;min-width:140px;accent-color:#141414}
.field input[type=file]{font-size:14px;max-width:100%}
.nav .trackhead{font-size:13px;font-weight:700;padding:14px 10px 4px;color:var(--mut);border-top:2px solid var(--line);margin-top:8px}
@media(max-width:900px){.nav .trackhead{flex:none;border:0;margin:0;padding:12px 6px;align-self:center}}
.tag{display:inline-block;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:2px 8px;margin-bottom:10px}
@media(prefers-reduced-motion:no-preference){.flow{stroke-dasharray:8 8;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><i></i><span data-ui="brand"></span></div>
  <div class="prog"><span data-ui="progress"></span><div class="track"><div class="fill" id="pfill"></div></div><span id="ptxt">0%</span></div>
  <div class="langs" role="group" aria-label="Language">
    <button class="chip" data-lang="en">English</button>
    <button class="chip" data-lang="ne">नेपाली</button>
    <button class="chip" data-lang="zh">中文</button>
    <button class="chip" id="bgBtn" aria-expanded="false" aria-controls="bgPanel" data-ui="bgBtn"></button>
  </div>
</div></header>
<div id="bgLayer" aria-hidden="true"></div>
<section id="bgPanel" hidden aria-labelledby="bgTitle">
  <h2 id="bgTitle" data-ui="bgTitle"></h2>
  <p data-ui="bgHelp"></p>
  <div class="sw" id="swatches"></div>
  <label class="field"><span data-ui="bgColor"></span><input type="color" id="bgColor" value="#2a9d8f"></label>
  <label class="field"><span data-ui="bgImage"></span><input type="file" id="bgFile" accept="image/*"></label>
  <label class="field"><span data-ui="bgVeil"></span><input type="range" id="bgVeil" min="55" max="98" value="88"></label>
  <p id="bgMsg" role="status"></p>
  <div class="tools-row"><button class="btn" id="bgReset" data-ui="bgReset"></button><button class="btn pri" id="bgClose" data-ui="bgClose"></button></div>
</section>

<section class="band hero"><div>
  <h1 data-ui="h1"></h1>
  <p data-ui="intro"></p>
  <p class="note" data-ui="note"></p>
</div><div class="fig" id="fig"><svg id="hero" viewBox="0 0 640 400" role="img" aria-label="AI agent diagram"></svg></div></section>

<nav class="tabs" aria-label="Sections">
  <a href="#lesson-0" data-tab="lesson" data-ui="tabLessons"></a>
  <a href="#playground" data-tab="playground" data-ui="tabPlay"></a>
  <a href="#glossary" data-tab="glossary" data-ui="tabGloss"></a>
  <a href="#resources" data-tab="resources" data-ui="tabRes"></a>
</nav>

<main class="band"><div class="wrap">
  <div id="v-lesson" class="layout"><nav class="nav" id="nav" aria-label="Lessons"></nav><div id="lesson"></div></div>
  <div id="v-playground" hidden></div>
  <div id="v-glossary" hidden></div>
  <div id="v-resources" hidden></div>
</div></main>
<footer class="band"><div class="wrap" data-ui="foot"></div></footer>

<script>
{
/* ---------- text helpers ---------- */
const T=(en,ne,zh)=>({en,ne,zh});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store={get(k){try{return JSON.parse(localStorage.getItem('agentschool.'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('agentschool.'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang')||'en';
const L=o=>o==null?'':(typeof o==='string'?o:(o[lang]||o.en));

const UI={
brand:T('Agent School','एजेन्ट स्कुल','智能体学校'),
progress:T('Progress','प्रगति','进度'),
h1:T('Build your own AI agent, one line at a time','आफ्नै AI एजेन्ट बनाउनुहोस्, एक-एक लाइन गर्दै','一行一行，亲手做出你自己的AI智能体'),
intro:T('No coding experience needed. Read the simple explanation, type each line of code yourself, press Check, then Run it. Real Python runs right here in your browser, so you can practise without installing anything.',
'कोडिङको कुनै अनुभव चाहिँदैन। सजिलो व्याख्या पढ्नुहोस्, कोडको हरेक लाइन आफैँ टाइप गर्नुहोस्, "जाँच्नुहोस्" थिच्नुहोस्, अनि "चलाउनुहोस्" थिच्नुहोस्। साँचो Python यही ब्राउजरमा चल्छ, त्यसैले केही इन्स्टल नगरी अभ्यास गर्न सक्नुहुन्छ।',
'不需要任何编程经验。先读简单的解释，再亲手输入每一行代码，点击"检查"，然后点击"运行"。真正的Python就在你的浏览器里运行，不用安装任何东西就能练习。'),
note:T('Your progress is saved in this browser. Every hard word is explained in the Glossary tab.','तपाईंको प्रगति यही ब्राउजरमा सुरक्षित हुन्छ। हरेक गाह्रो शब्दको अर्थ "शब्दकोश" ट्याबमा छ।','你的进度会保存在这个浏览器里。所有难懂的词都在"词汇表"里有解释。'),
tabLessons:T('Lessons','पाठहरू','课程'),tabPlay:T('Playground','अभ्यास मैदान','练习场'),tabGloss:T('Glossary','शब्दकोश','词汇表'),tabRes:T('Resources','स्रोतहरू','学习资源'),
lesson:T('Lesson','पाठ','第'),lessonSuf:T('','',' 课'),
code:T('Code to learn','सिक्ने कोड','要学习的代码'),
type:T('Your turn: type it yourself (do not copy-paste, typing helps you remember)','अब तपाईंको पालो: आफैँ टाइप गर्नुहोस् (कपी-पेस्ट नगर्नुहोस्, टाइप गर्दा राम्ररी याद हुन्छ)','轮到你了：亲手输入（不要复制粘贴，自己打字记得更牢）'),
check:T('Check','जाँच्नुहोस्','检查'),run:T('Run','चलाउनुहोस्','运行'),answer:T('Show answer','उत्तर देखाउनुहोस्','显示答案'),copy:T('Copy','कपी','复制'),copied:T('Copied','कपी भयो','已复制'),
empty:T('The box is empty. Type the code first.','बाकस खाली छ। पहिले कोड टाइप गर्नुहोस्।','输入框是空的，请先输入代码。'),
right:T('Correct! Well done. Now press Run to see what it does.','सही! धेरै राम्रो। अब के हुन्छ हेर्न "चलाउनुहोस्" थिच्नुहोस्।','正确！做得好。现在点击"运行"看看结果。'),
wrongLine:T('Almost! Look at line','लगभग मिल्यो! यो लाइन हेर्नुहोस्:','差一点！请看第'),
wrongLineSuf:T('','','行'),
expected:T('It should be:','हुनुपर्ने:','应该是：'),you:T('You typed:','तपाईंले टाइप गर्नुभयो:','你输入的是：'),
missing:T('(this line is missing)','(यो लाइन छुटेको छ)','（缺少这一行）'),
extra:T('You have extra lines at the end.','अन्त्यमा थप लाइनहरू छन्।','末尾多了几行。'),
spaces:T('Tip: count the spaces at the start of the line. Python uses 4 spaces to show what belongs inside.','सुझाव: लाइनको सुरुमा कति खाली ठाउँ (space) छ गन्नुहोस्। भित्र पर्ने कुरा देखाउन Python ले ४ वटा space प्रयोग गर्छ।','提示：数一数行首的空格。Python用4个空格表示"属于里面的内容"。'),
loading:T('Starting Python in your browser (first time takes about 10–20 seconds)…','तपाईंको ब्राउजरमा Python सुरु हुँदैछ (पहिलो पटक १०–२० सेकेन्ड लाग्छ)…','正在浏览器中启动Python（第一次大约需要10–20秒）…'),
noPy:T('Python could not start here (maybe no internet). Here is what the code prints:','यहाँ Python सुरु हुन सकेन (सायद इन्टरनेट छैन)। यो कोडले यस्तो देखाउँछ:','这里无法启动Python（可能没有网络）。这段代码会输出：'),
noOut:T('(The code ran but printed nothing.)','(कोड चल्यो तर केही देखाएन।)','（代码运行了，但没有输出任何内容。）'),
errHead:T('Error. Do not worry, every programmer sees errors every day. Read the hint:','त्रुटि (Error)। चिन्ता नगर्नुहोस्, हरेक प्रोग्रामरले दिनहुँ त्रुटि देख्छन्। सुझाव पढ्नुहोस्:','出错了。别担心，每个程序员每天都会遇到错误。看看提示：'),

const TOOLS_PRE=`def calculator(text):
    total = 0
    for word in text.split():
        word = word.strip("?.!,")
        if word.isdigit():
            total = total + int(word)
    return total

from datetime import datetime

def clock():
    return datetime.now().strftime("%H:%M")

def brain(question):
    q = question.lower()
    if "plus" in q or "+" in q:
        return "calculator"
    elif "time" in q:
        return "clock"
    else:
        return "none"`;

 {t:T('Chatbot vs agent','च्याटबट र एजेन्टमा फरक','聊天机器人和智能体的区别'),
  x:T(`<p>A normal <b>chatbot</b> only talks. You ask, it replies with words.</p><p>An <b>AI agent</b> can also <b>do things</b>. It can use a calculator, check the time, search the web, read a file, or send a message, and it decides by itself which one to use.</p><p>Example: you say "What is 1250 plus 3780?" A chatbot may guess. An agent picks up its calculator tool, gets the exact answer, and tells you.</p>`,
  `<p>साधारण <b>च्याटबट</b>ले कुरा मात्र गर्छ। तपाईं सोध्नुहुन्छ, उसले शब्दमा जवाफ दिन्छ।</p><p><b>AI एजेन्ट</b>ले <b>काम पनि गर्न</b> सक्छ। यसले क्याल्कुलेटर चलाउन, समय हेर्न, इन्टरनेटमा खोज्न, फाइल पढ्न वा सन्देश पठाउन सक्छ, र कुन चलाउने भनेर आफैँ निर्णय गर्छ।</p><p>उदाहरण: तपाईं भन्नुहुन्छ "1250 plus 3780 कति हो?" च्याटबटले अनुमान गर्न सक्छ। एजेन्टले आफ्नो क्याल्कुलेटर औजार उठाउँछ, ठ्याक्कै उत्तर निकाल्छ, अनि तपाईंलाई भन्छ।</p>`,
  `<p>普通的<b>聊天机器人</b>只会说话：你问，它用文字回答。</p><p><b>AI智能体</b>还能<b>做事</b>。它可以用计算器、看时间、上网搜索、读文件、发消息，而且它会自己决定用哪一个。</p><p>例子：你说"1250 加 3780 等于多少？"聊天机器人可能会猜。智能体会拿起它的计算器工具，算出准确答案，再告诉你。</p>`)},
 {t:T('The 4 parts of every agent','हरेक एजेन्टका ४ भाग','每个智能体的4个部分'),
  x:T(`<p>Look at the drawing at the top of this page. Every agent has:</p><ul><li><b>Brain</b>: the AI model (like Claude) that reads your question and decides what to do.</li><li><b>Tools</b>: small programs the brain can use, like a calculator or a clock.</li><li><b>Memory</b>: a list of everything said so far, so the agent remembers.</li><li><b>Loop</b>: the agent repeats think → act → check until the job is done.</li></ul><p>Think of a helpful shop assistant: they listen (question), think (brain), walk to the shelf (tool), remember what you bought last time (memory), and keep helping until you are happy (loop).</p>`,
  `<p>यो पेजको माथिको चित्र हेर्नुहोस्। हरेक एजेन्टमा यी हुन्छन्:</p><ul><li><b>दिमाग</b>: AI मोडेल (जस्तै Claude) जसले तपाईंको प्रश्न पढ्छ र के गर्ने निर्णय गर्छ।</li><li><b>औजार</b>: दिमागले चलाउन सक्ने साना प्रोग्राम, जस्तै क्याल्कुलेटर वा घडी।</li><li><b>सम्झना (मेमोरी)</b>: अहिलेसम्म भएका सबै कुराको सूची, ताकि एजेन्टले याद राखोस्।</li><li><b>लुप</b>: काम नसकिउन्जेल एजेन्टले सोच → गर → जाँच दोहोर्‍याइरहन्छ।</li></ul><p>पसलको सहयोगी सम्झनुहोस्: उसले सुन्छ (प्रश्न), सोच्छ (दिमाग), र्‍याकमा गएर सामान ल्याउँछ (औजार), तपाईंले पहिले के किन्नुभएको थियो याद राख्छ (मेमोरी), र तपाईं खुसी नहुन्जेल सहयोग गरिरहन्छ (लुप)।</p>`,
  `<p>看看本页顶部的图。每个智能体都有：</p><ul><li><b>大脑</b>：AI模型（比如Claude），它读懂你的问题并决定做什么。</li><li><b>工具</b>：大脑可以使用的小程序，比如计算器或时钟。</li><li><b>记忆</b>：到目前为止说过的所有内容的列表，让智能体记得住。</li><li><b>循环</b>：智能体不断重复"思考 → 行动 → 检查"，直到任务完成。</li></ul><p>想象一位热心的店员：他听你说（问题），思考（大脑），走到货架取货（工具），记得你上次买了什么（记忆），一直帮你直到你满意（循环）。</p>`)},
 {t:T('Your plan and how to use this page','तपाईंको योजना र यो पेज कसरी प्रयोग गर्ने','你的学习计划和本页用法'),
  x:T(`<p>You will learn Python (the most popular language for AI) from zero, and build a small agent step by step. Lessons 1–7 teach Python basics. Lessons 8–11 build the agent with a pretend brain that runs free in your browser. Lesson 12 connects it to the real Claude AI on your computer.</p><p>For each step:</p><ul><li>Read the explanation.</li><li>Look at the code.</li><li>Type it yourself in the box.</li><li>Press <b>Check</b> to compare, then <b>Run</b> to see the result.</li></ul><p>Making mistakes is normal and is how everyone learns.</p>`,
  `<p>तपाईंले शून्यबाट Python (AI का लागि सबैभन्दा लोकप्रिय भाषा) सिक्नुहुनेछ र चरणबद्ध रूपमा सानो एजेन्ट बनाउनुहुनेछ। पाठ १–७ मा Python का आधारभूत कुरा छन्। पाठ ८–११ मा ब्राउजरमै निःशुल्क चल्ने "नक्कली दिमाग" सहितको एजेन्ट बनाइन्छ। पाठ १२ मा त्यसलाई तपाईंको कम्प्युटरमा साँचो Claude AI सँग जोडिन्छ।</p><p>हरेक चरणमा:</p><ul><li>व्याख्या पढ्नुहोस्।</li><li>कोड हेर्नुहोस्।</li><li>बाकसमा आफैँ टाइप गर्नुहोस्।</li><li><b>जाँच्नुहोस्</b> थिचेर तुलना गर्नुहोस्, अनि <b>चलाउनुहोस्</b> थिचेर नतिजा हेर्नुहोस्।</li></ul><p>गल्ती गर्नु सामान्य हो, सबैजना यसरी नै सिक्छन्।</p>`,
  `<p>你将从零开始学习Python（AI领域最流行的编程语言），并一步步做出一个小智能体。第1–7课学习Python基础。第8–11课用一个"假大脑"搭建智能体，它免费在浏览器里运行。第12课在你的电脑上把它连接到真正的Claude AI。</p><p>每一步：</p><ul><li>阅读解释。</li><li>看代码。</li><li>在输入框里自己打一遍。</li><li>点击<b>检查</b>对比，再点击<b>运行</b>看结果。</li></ul><p>犯错很正常，每个人都是这样学会的。</p>`)}

print(agent_name)`,out:`Sathi`,
  x:T(`<p>A <b>variable</b> is a box with a name label. <code>agent_name</code> is the label, <code>"Sathi"</code> is what goes inside.</p><p>The <code>=</code> sign here does not mean "equals". It means <b>"put into the box"</b>.</p><p>Line 2 prints the box's contents. Notice: no quotes around agent_name, because we want what is inside the box, not the word itself.</p><p>Rules for names: no spaces (use <code>_</code>), do not start with a number.</p>`,
  `<p><b>भेरिएबल</b> भनेको नामको लेबल भएको बाकस हो। <code>agent_name</code> लेबल हो, <code>"Sathi"</code> भित्र राखिएको कुरा हो।</p><p>यहाँ <code>=</code> को अर्थ "बराबर" होइन। यसको अर्थ <b>"बाकसमा राख"</b> हो।</p><p>लाइन २ ले बाकसभित्रको कुरा देखाउँछ। ध्यान दिनुहोस्: agent_name वरिपरि उद्धरण चिह्न छैन, किनकि हामीलाई शब्द होइन, बाकसभित्रको कुरा चाहिएको हो।</p><p>नामका नियम: बीचमा space नराख्ने (<code>_</code> प्रयोग गर्ने), संख्याबाट सुरु नगर्ने।</p>`,
  `<p><b>变量</b>就是一个贴着名字标签的盒子。<code>agent_name</code> 是标签，<code>"Sathi"</code> 是放进去的东西。</p><p>这里的 <code>=</code> 不是"等于"，而是<b>"放进盒子"</b>的意思。</p><p>第2行显示盒子里的内容。注意：agent_name 两边没有引号，因为我们要的是盒子里的东西，而不是这个词本身。</p><p>命名规则：不能有空格（用 <code>_</code> 代替），不能以数字开头。</p>`)},
 {t:T('Print several things together','धेरै कुरा सँगै देखाउनुहोस्','一起显示多个内容'),code:`age = 1
print(agent_name, "is", age, "year old")`,out:`Sathi is 1 year old`,
  x:T(`<p><code>age</code> holds a number (no quotes). Inside <code>print( )</code>, commas <code>,</code> separate several things. Python puts a space between them.</p><p>agent_name still exists from the previous step, because steps in the same lesson continue from each other.</p>`,
  `<p><code>age</code> मा संख्या छ (उद्धरण चिह्न छैन)। <code>print( )</code> भित्र अल्पविराम <code>,</code> ले धेरै कुरा छुट्याउँछ। Python ले तिनका बीचमा space राख्छ।</p><p>agent_name अघिल्लो चरणबाटै छ, किनकि एउटै पाठका चरणहरू एकअर्कासँग जोडिएका हुन्छन्।</p>`,
  `<p><code>age</code> 里存的是数字（没有引号）。在 <code>print( )</code> 里，逗号 <code>,</code> 用来分隔多个内容，Python会在它们之间加一个空格。</p><p>agent_name 是上一步创建的，仍然存在，因为同一课的步骤是连在一起的。</p>`)},
 {t:T('f-strings: put variables inside text','f-string: अक्षरभित्र भेरिएबल राख्नुहोस्','f-string：把变量放进文字里'),code:`print(f"Hello! My name is {agent_name}.")`,out:`Hello! My name is Sathi.`,
  x:T(`<p>Put the letter <code>f</code> just before the first quote. Then anything inside curly brackets <code>{ }</code> is replaced with the variable's value.</p><p>Agents use this all the time to build messages.</p>`,
  `<p>पहिलो उद्धरण चिह्नभन्दा ठीक अगाडि <code>f</code> अक्षर राख्नुहोस्। त्यसपछि मझौला कोष्ठ <code>{ }</code> भित्रको कुरा भेरिएबलको मानले बदलिन्छ।</p><p>एजेन्टहरूले सन्देश बनाउन यो सधैँ प्रयोग गर्छन्।</p>`,
  `<p>在第一个引号前面加上字母 <code>f</code>。这样，花括号 <code>{ }</code> 里的内容就会被替换成变量的值。</p><p>智能体经常用这种方法来组合消息。</p>`)},
 {t:T('Kinds of data','डाटाका किसिम','数据的类型'),code:`print(type(agent_name))
print(type(age))`,out:`<class 'str'>
<class 'int'>`,
  x:T(`<p><code>type( )</code> tells you what kind of thing is in a box.</p><ul><li><code>str</code> = string = text</li><li><code>int</code> = integer = whole number</li></ul><p>Other kinds you will meet: <code>float</code> (decimal number like 4.0), <code>bool</code> (True or False), <code>list</code> and <code>dict</code> (next lesson).</p>`,
  `<p><code>type( )</code> ले बाकसमा कस्तो किसिमको कुरा छ भनेर बताउँछ।</p><ul><li><code>str</code> = string = अक्षर</li><li><code>int</code> = integer = पूर्ण संख्या</li></ul><p>अरू किसिम पनि भेटिनेछन्: <code>float</code> (दशमलव संख्या, जस्तै 4.0), <code>bool</code> (True वा False, अर्थात् साँचो वा झुटो), <code>list</code> र <code>dict</code> (अर्को पाठमा)।</p>`,
  `<p><code>type( )</code> 告诉你盒子里装的是什么类型的东西。</p><ul><li><code>str</code> = 字符串 = 文字</li><li><code>int</code> = 整数</li></ul><p>以后还会遇到：<code>float</code>（小数，比如 4.0）、<code>bool</code>（True 或 False，真或假）、<code>list</code> 和 <code>dict</code>（下一课）。</p>`)}
 ]},

 d:T('Keep many things together. Agents keep their tools and messages this way.','धेरै कुरा सँगै राख्नुहोस्। एजेन्टले आफ्ना औजार र सन्देश यसरी नै राख्छ।','把很多东西放在一起。智能体就是这样保存工具和消息的。'),
 s:[
 {t:T('A list','सूची (list)','列表'),code:`tools = ["calculator", "clock", "notebook"]
print(tools)`,out:`['calculator', 'clock', 'notebook']`,
  x:T(`<p>A <b>list</b> holds many items in order, inside square brackets <code>[ ]</code>, separated by commas. Like a shopping list.</p>`,
  `<p><b>सूची (list)</b> मा धेरै वस्तु क्रमैसँग, वर्गाकार कोष्ठ <code>[ ]</code> भित्र, अल्पविरामले छुट्याएर राखिन्छ। सामान किन्ने सूची जस्तै।</p>`,
  `<p><b>列表</b>按顺序存放多个项目，写在方括号 <code>[ ]</code> 里，用逗号隔开，就像购物清单。</p>`)},
 {t:T('Get one item: counting starts at 0','एउटा वस्तु निकाल्नुहोस्: गन्ती ० बाट','取出一项：编号从0开始'),code:`print(tools[0])
print(tools[2])`,out:`calculator
notebook`,
  x:T(`<p>Each item has a position number called an <b>index</b>. Python starts counting at <b>0</b>, not 1. So <code>tools[0]</code> is the first item and <code>tools[2]</code> is the third.</p>`,
  `<p>हरेक वस्तुको स्थान नम्बर हुन्छ, जसलाई <b>इन्डेक्स (index)</b> भनिन्छ। Python ले गन्ती १ बाट होइन, <b>०</b> बाट सुरु गर्छ। त्यसैले <code>tools[0]</code> पहिलो र <code>tools[2]</code> तेस्रो वस्तु हो।</p>`,
  `<p>每一项都有一个位置编号，叫做<b>索引（index）</b>。Python从<b>0</b>开始数，而不是1。所以 <code>tools[0]</code> 是第一项，<code>tools[2]</code> 是第三项。</p>`)},
 {t:T('Add to a list','सूचीमा थप्नुहोस्','往列表里添加'),code:`tools.append("search")
print(tools)
print(len(tools))`,out:`['calculator', 'clock', 'notebook', 'search']
4`,
  x:T(`<p><code>.append( )</code> adds an item at the end. The dot means "use this list's own action".</p><p><code>len( )</code> counts how many items there are. Later, our agent's memory grows exactly like this.</p>`,
  `<p><code>.append( )</code> ले अन्त्यमा वस्तु थप्छ। डट (.) को अर्थ "यही सूचीको आफ्नै काम प्रयोग गर" हो।</p><p><code>len( )</code> ले कति वस्तु छन् गन्छ। पछि हाम्रो एजेन्टको मेमोरी ठ्याक्कै यसरी नै बढ्छ।</p>`,
  `<p><code>.append( )</code> 在末尾添加一项。点号的意思是"使用这个列表自己的功能"。</p><p><code>len( )</code> 数一数一共有几项。之后，我们智能体的记忆就是这样增长的。</p>`)},
 {t:T('A dictionary: key → value','डिक्सनरी: key → value','字典：键 → 值'),code:`agent = {"name": "Sathi", "language": "Nepali"}
print(agent["name"])
print(agent["language"])`,out:`Sathi
Nepali`,
  x:T(`<p>A <b>dictionary</b> (<code>dict</code>) stores pairs inside curly brackets <code>{ }</code>. Each pair is <b>key: value</b>, like a real dictionary has word: meaning.</p><p>To get a value, write the key in square brackets: <code>agent["name"]</code>.</p>`,
  `<p><b>डिक्सनरी</b> (<code>dict</code>) ले मझौला कोष्ठ <code>{ }</code> भित्र जोडीहरू राख्छ। हरेक जोडी <b>key: value</b> (चाबी: मान) हो, जसरी साँच्चिकै शब्दकोशमा शब्द: अर्थ हुन्छ।</p><p>मान निकाल्न key लाई वर्गाकार कोष्ठमा लेख्नुहोस्: <code>agent["name"]</code>।</p>`,
  `<p><b>字典</b>（<code>dict</code>）在花括号 <code>{ }</code> 里存放成对的数据。每一对是<b>键: 值</b>，就像真正的字典里"词语: 意思"一样。</p><p>要取出值，把键写在方括号里：<code>agent["name"]</code>。</p>`)},
 {t:T('A message, the way real AI sees it','सन्देश, साँचो AI ले देख्ने तरिकाले','真正的AI看到的消息格式'),code:`message = {"role": "user", "content": "What time is it?"}
print(message["role"])
print(message["content"])`,out:`user
What time is it?`,
  x:T(`<p>This is important! Real AI models like Claude receive messages as dictionaries exactly like this:</p><ul><li><code>"role"</code>: who is speaking, <code>"user"</code> (you) or <code>"assistant"</code> (the AI).</li><li><code>"content"</code>: what was said.</li></ul><p>A whole conversation is a <b>list of these dictionaries</b>.</p>`,
  `<p>यो महत्त्वपूर्ण छ! Claude जस्ता साँचो AI मोडेलले सन्देश ठ्याक्कै यस्तै डिक्सनरीको रूपमा पाउँछन्:</p><ul><li><code>"role"</code>: को बोल्दैछ, <code>"user"</code> (तपाईं) वा <code>"assistant"</code> (AI)।</li><li><code>"content"</code>: के भनियो।</li></ul><p>पूरा कुराकानी भनेको <b>यस्ता डिक्सनरीहरूको सूची</b> हो।</p>`,
  `<p>这一点很重要！像Claude这样的真正AI模型，收到的消息就是这样的字典：</p><ul><li><code>"role"</code>：谁在说话，<code>"user"</code>（你）或 <code>"assistant"</code>（AI）。</li><li><code>"content"</code>：说了什么。</li></ul><p>一整段对话就是<b>由这样的字典组成的列表</b>。</p>`)}
 ]},
{t:T('Decisions: if / elif / else','निर्णय: if / elif / else','做决定：if / elif / else'),
 d:T('Teach the program to choose. This is how an agent picks a tool.','प्रोग्रामलाई छान्न सिकाउनुहोस्। एजेन्टले औजार यसरी नै छान्छ।','教程序做选择。智能体就是这样挑选工具的。'),
 s:[
 {t:T('if','if (यदि)','if（如果）'),code:`question = "what is 2 plus 3"
if "plus" in question:
    print("I should use the calculator")`,out:`I should use the calculator`,
  x:T(`<p>Line 2 means: <b>if</b> the word "plus" is <b>in</b> the question, then do the lines below.</p><ul><li>The line ends with a colon <code>:</code></li><li>The line inside starts with <b>4 spaces</b>. This is called <b>indentation</b>. It tells Python "this line belongs inside the if". In the box, press Tab to add 4 spaces.</li></ul>`,
  `<p>लाइन २ को अर्थ: <b>यदि</b> प्रश्न<b>भित्र</b> "plus" शब्द छ भने तलका लाइन गर।</p><ul><li>लाइनको अन्त्यमा कोलन <code>:</code> हुन्छ।</li><li>भित्रको लाइन <b>४ वटा space</b> बाट सुरु हुन्छ। यसलाई <b>इन्डेन्टेसन (indentation)</b> भनिन्छ। यसले Python लाई "यो लाइन if भित्र पर्छ" भन्छ। बाकसमा Tab थिच्दा ४ space थपिन्छ।</li></ul>`,
  `<p>第2行的意思是：<b>如果</b>问题<b>里面有</b>"plus"这个词，就执行下面的行。</p><ul><li>这一行以冒号 <code>:</code> 结尾。</li><li>里面的那一行前面有<b>4个空格</b>，这叫<b>缩进</b>，它告诉Python"这一行属于if里面"。在输入框里按Tab键可以输入4个空格。</li></ul>`)},
 {t:T('else: otherwise','else: नत्र','else：否则'),code:`question = "tell me a joke"
if "plus" in question:
    print("I should use the calculator")
else:
    print("I can answer by myself")`,out:`I can answer by myself`,
  x:T(`<p><code>else:</code> means "if not, do this instead". Only one of the two paths runs. Here the question has no "plus", so the else path runs.</p>`,
  `<p><code>else:</code> को अर्थ "होइन भने, यसको सट्टा यो गर" हो। दुईमध्ये एउटा मात्र बाटो चल्छ। यहाँ प्रश्नमा "plus" छैन, त्यसैले else को बाटो चल्छ।</p>`,
  `<p><code>else:</code> 的意思是"如果不是，就做这个"。两条路只会走一条。这里问题里没有"plus"，所以走else这条路。</p>`)},
 {t:T('elif: more choices','elif: थप विकल्प','elif：更多选择'),code:`question = "what time is it"
if "plus" in question:
    print("I should use the calculator")
elif "time" in question:
    print("I should use the clock")
else:
    print("I can answer by myself")`,out:`I should use the clock`,
  x:T(`<p><code>elif</code> = "else if". Python checks from top to bottom and runs the <b>first</b> match only. This is a tiny "brain" that chooses a tool! Change the question and run again.</p>`,
  `<p><code>elif</code> = "else if" (नत्र यदि)। Python ले माथिबाट तल जाँच्छ र <b>पहिलो</b> मिल्ने मात्र चलाउँछ। यो औजार छान्ने सानो "दिमाग" हो! प्रश्न बदलेर फेरि चलाउनुहोस्।</p>`,
  `<p><code>elif</code> = "else if"（否则如果）。Python从上往下检查，只执行<b>第一个</b>符合的。这就是一个会挑工具的小"大脑"！改一下问题再运行试试。</p>`)}
 ]},
{t:T('Loops: repeat work','लुप: काम दोहोर्‍याउनुहोस्','循环：重复做事'),
 d:T('Agents repeat think → act → check. Loops make repeating easy.','एजेन्टले सोच → गर → जाँच दोहोर्‍याउँछ। लुपले दोहोर्‍याउन सजिलो बनाउँछ।','智能体会重复"思考 → 行动 → 检查"。循环让重复变得简单。'),
 s:[
 {t:T('for: once for each item','for: हरेक वस्तुका लागि एक पटक','for：每一项做一次'),code:`tools = ["calculator", "clock", "notebook"]
for tool in tools:
    print("I can use:", tool)`,out:`I can use: calculator
I can use: clock
I can use: notebook`,
  x:T(`<p>Read line 2 as: "for each <code>tool</code> in the list <code>tools</code>, do the indented lines". Each time round, the box <code>tool</code> holds the next item.</p>`,
  `<p>लाइन २ लाई यसरी पढ्नुहोस्: "<code>tools</code> सूचीको हरेक <code>tool</code> का लागि, इन्डेन्ट गरिएका लाइन गर"। हरेक पटक <code>tool</code> बाकसमा अर्को वस्तु आउँछ।</p>`,
  `<p>第2行可以读作："对于列表 <code>tools</code> 里的每一个 <code>tool</code>，执行缩进的那几行"。每转一圈，盒子 <code>tool</code> 里就装着下一项。</p>`)},
 {t:T('while: repeat until done','while: नसकिउन्जेल दोहोर्‍याउनुहोस्','while：一直重复直到完成'),code:`step = 1
while step <= 3:
    print("Thinking... step", step)
    step = step + 1
print("Done!")`,out:`Thinking... step 1
Thinking... step 2
Thinking... step 3
Done!`,
  x:T(`<p><code>while</code> repeats <b>as long as</b> the condition is true. <code>&lt;=</code> means "less than or equal to".</p><p>Line 4 adds 1 to step each time. Without it, step stays 1 forever and the loop never stops (an <b>infinite loop</b>). Real agents use a loop like this: keep going until the job is finished.</p><p>The last line has no spaces in front, so it runs once, after the loop.</p>`,
  `<p><code>while</code> ले सर्त साँचो <b>रहुन्जेल</b> दोहोर्‍याउँछ। <code>&lt;=</code> को अर्थ "सानो वा बराबर" हो।</p><p>लाइन ४ ले हरेक पटक step मा १ थप्छ। यो नभए step सधैँ १ रहन्छ र लुप कहिल्यै रोकिँदैन (<b>अनन्त लुप</b>)। साँचो एजेन्टले यस्तै लुप प्रयोग गर्छ: काम नसकिउन्जेल चलिरहने।</p><p>अन्तिम लाइनको अगाडि space छैन, त्यसैले त्यो लुपपछि एक पटक मात्र चल्छ।</p>`,
  `<p><code>while</code> 会在条件为真的<b>时候一直</b>重复。<code>&lt;=</code> 表示"小于或等于"。</p><p>第4行每次给 step 加1。如果没有这一行，step 永远是1，循环永远不会停（叫<b>死循环</b>）。真正的智能体就用这样的循环：一直做，直到任务完成。</p><p>最后一行前面没有空格，所以它只在循环结束后运行一次。</p>`)}
 ]},

  x:T(`<p>A <b>class</b> is a blueprint, like a house plan. An <b>object</b> is a real thing built from it, like an actual house. One plan, many houses.</p><ul><li><code>class Robot:</code> starts the blueprint. Class names start with a capital letter.</li><li><code>__init__</code> (two underscores each side) is the <b>setup function</b>. It runs automatically when a new robot is built.</li><li><code>self</code> means "this robot itself". <code>self.name = name</code> stores the name inside this robot.</li><li><code>r = Robot("Sathi")</code> builds one robot and puts it in box r.</li></ul>`,
  `<p><b>क्लास</b> भनेको घरको नक्सा जस्तो ब्लुप्रिन्ट हो। <b>अब्जेक्ट (वस्तु)</b> भनेको त्यसबाट बनेको साँचो चीज हो, जस्तै बनिसकेको घर। एउटा नक्सा, धेरै घर।</p><ul><li><code>class Robot:</code> ले नक्सा सुरु गर्छ। क्लासको नाम ठूलो अक्षरबाट सुरु हुन्छ।</li><li><code>__init__</code> (दुवैतिर दुई-दुई वटा underscore) <b>सेटअप फङ्सन</b> हो। नयाँ रोबोट बन्दा यो आफैँ चल्छ।</li><li><code>self</code> को अर्थ "यही रोबोट आफैँ" हो। <code>self.name = name</code> ले नाम यही रोबोटभित्र राख्छ।</li><li><code>r = Robot("Sathi")</code> ले एउटा रोबोट बनाएर r बाकसमा राख्छ।</li></ul>`,
  `<p><b>类</b>就是一张设计图，像房子的图纸。<b>对象</b>是按照它造出来的真实东西，像一栋真正的房子。一张图纸，可以造很多房子。</p><ul><li><code>class Robot:</code> 开始写设计图。类名以大写字母开头。</li><li><code>__init__</code>（两边各有两个下划线）是<b>初始化函数</b>，每造一个新机器人时它会自动运行。</li><li><code>self</code> 的意思是"这个机器人自己"。<code>self.name = name</code> 把名字存进这个机器人里。</li><li><code>r = Robot("Sathi")</code> 造出一个机器人，放进盒子 r 里。</li></ul>`)},
 {t:T('Methods: what an object can do','मेथड: अब्जेक्टले गर्न सक्ने काम','方法：对象能做的事'),code:`class Robot:

  x:T(`<p>A function inside a class is called a <b>method</b>. It is an action the object can do. Every method's first input is <code>self</code>, so it can reach the object's own data, like <code>self.name</code>.</p><p>Call it with a dot: <code>r.greet()</code>.</p>`,
  `<p>क्लासभित्रको फङ्सनलाई <b>मेथड</b> भनिन्छ। यो अब्जेक्टले गर्न सक्ने काम हो। हरेक मेथडको पहिलो इनपुट <code>self</code> हुन्छ, ताकि त्यसले अब्जेक्टको आफ्नै डाटा, जस्तै <code>self.name</code>, प्रयोग गर्न सकोस्।</p><p>डट प्रयोग गरेर बोलाउनुहोस्: <code>r.greet()</code>।</p>`,
  `<p>写在类里面的函数叫做<b>方法</b>，它是对象能做的动作。每个方法的第一个输入都是 <code>self</code>，这样它就能用到对象自己的数据，比如 <code>self.name</code>。</p><p>用点号调用：<code>r.greet()</code>。</p>`)},

  x:T(`<p>This tool finds all numbers in a sentence and adds them. Line by line:</p><ul><li><code>total = 0</code>: start at zero.</li><li><code>text.split()</code>: cut the sentence into words: "what", "is", "2", "plus", "3".</li><li><code>word.strip("?.!,")</code>: remove punctuation from the ends, so "5?" becomes "5".</li><li><code>word.isdigit()</code>: True if the word is only digits.</li><li><code>int(word)</code>: turn the text "2" into the number 2, then add it to total.</li><li><code>return total</code>: send back the answer.</li></ul><p>Notice the levels of indentation: 4, 8 and 12 spaces show what is inside what.</p>`,
  `<p>यो औजारले वाक्यमा भएका सबै संख्या खोजेर जोड्छ। लाइन-लाइन:</p><ul><li><code>total = 0</code>: शून्यबाट सुरु।</li><li><code>text.split()</code>: वाक्यलाई शब्दमा टुक्र्याउँछ: "what", "is", "2", "plus", "3"।</li><li><code>word.strip("?.!,")</code>: छेउका चिह्न हटाउँछ, त्यसैले "5?" "5" बन्छ।</li><li><code>word.isdigit()</code>: शब्दमा अङ्क मात्र छ भने True।</li><li><code>int(word)</code>: अक्षर "2" लाई संख्या 2 बनाउँछ, अनि total मा जोड्छ।</li><li><code>return total</code>: उत्तर फिर्ता पठाउँछ।</li></ul><p>इन्डेन्टेसनका तह हेर्नुहोस्: ४, ८ र १२ space ले कुन कुराभित्र के छ देखाउँछन्।</p>`,
  `<p>这个工具会找出句子里所有的数字并把它们加起来。逐行解释：</p><ul><li><code>total = 0</code>：从0开始。</li><li><code>text.split()</code>：把句子切成一个个词："what"、"is"、"2"、"plus"、"3"。</li><li><code>word.strip("?.!,")</code>：去掉两端的标点，所以"5?"变成"5"。</li><li><code>word.isdigit()</code>：如果这个词全是数字，就是True。</li><li><code>int(word)</code>：把文字"2"变成数字2，再加到total上。</li><li><code>return total</code>：把答案送回去。</li></ul><p>注意缩进的层次：4、8、12个空格表示谁在谁的里面。</p>`)},

  `<p>साँचो दिमाग (Claude जस्तो LLM) ले भाषा बुझ्छ। हाम्रोले केवल मुख्य शब्द खोज्छ, तर यसको <b>काम उही हो</b>: प्रश्न पढ्ने र चलाउनुपर्ने औजारको नाम फर्काउने।</p><ul><li><code>.lower()</code> ले सबै अक्षर सानो बनाउँछ, त्यसैले "TIME" र "time" दुवै मिल्छन्।</li><li><code>or</code> को अर्थ "वा", दुईमध्ये एउटा भए पुग्छ।</li></ul><p>यो दिमाग नक्कली भएकाले निःशुल्क छ र यहीँ चल्छ। पाठ १२ मा यसलाई साँचोसँग साट्नुहुनेछ।</p>`,
  `<p>真正的大脑（像Claude这样的大语言模型）能理解语言。我们的只是找关键词，但它的<b>任务是一样的</b>：读懂问题，返回要用的工具名字。</p><ul><li><code>.lower()</code> 把所有字母变成小写，所以"TIME"和"time"都能匹配。</li><li><code>or</code> 表示"或者"，满足其中一个就行。</li></ul><p>因为这是假大脑，所以免费，并且在这里就能运行。第12课你会把它换成真正的大脑。</p>`)},

 s:[
 {t:T('The Agent class','Agent क्लास','Agent 类'),code:`class Agent:
    def __init__(self, name):
        self.name = name
        self.memory = []

    def remember(self, role, text):
        self.memory.append({"role": role, "content": text})

    def ask(self, question):
        self.remember("user", question)
        choice = brain(question)
        if choice == "calculator":
            answer = str(calculator(question))
        elif choice == "clock":
            answer = clock()
        else:
            answer = f"I am {self.name}. I can add numbers and tell the time."
        self.remember("assistant", answer)
        return answer

sathi = Agent("Sathi")
print(sathi.ask("What is 8 plus 9?"))`,out:`17`,
  x:T(`<p>This joins everything you learned:</p><ul><li><code>self.memory = []</code>: each agent starts with an empty list.</li><li><code>remember</code>: adds a message dictionary <code>{"role": ..., "content": ...}</code>, the same format real AI uses (Lesson 3).</li><li><code>ask</code>: saves the question, thinks, acts, saves the answer, and returns it.</li><li><code>str( )</code> turns the number 17 into text "17", so every answer is text.</li></ul><p>It is long. Type it slowly, one line at a time, and use Check to find mistakes.</p>`,
  `<p>यसले तपाईंले सिकेका सबै कुरा जोड्छ:</p><ul><li><code>self.memory = []</code>: हरेक एजेन्ट खाली सूचीबाट सुरु हुन्छ।</li><li><code>remember</code>: सन्देश डिक्सनरी <code>{"role": ..., "content": ...}</code> थप्छ, साँचो AI ले प्रयोग गर्ने उही ढाँचा (पाठ ३)।</li><li><code>ask</code>: प्रश्न सुरक्षित गर्छ, सोच्छ, काम गर्छ, उत्तर सुरक्षित गर्छ र फर्काउँछ।</li><li><code>str( )</code> ले संख्या 17 लाई अक्षर "17" बनाउँछ, ताकि हरेक उत्तर अक्षरमा होस्।</li></ul><p>यो लामो छ। बिस्तारै, एक-एक लाइन टाइप गर्नुहोस्, र गल्ती खोज्न "जाँच्नुहोस्" प्रयोग गर्नुहोस्।</p>`,
  `<p>这里把你学过的所有东西组合在一起：</p><ul><li><code>self.memory = []</code>：每个智能体一开始都有一个空列表。</li><li><code>remember</code>：添加一条消息字典 <code>{"role": ..., "content": ...}</code>，和真正的AI用的格式一样（第3课）。</li><li><code>ask</code>：保存问题，思考，行动，保存回答，然后返回回答。</li><li><code>str( )</code> 把数字17变成文字"17"，让每个回答都是文字。</li></ul><p>代码比较长。慢慢地一行一行输入，用"检查"来找错误。</p>`)},

 {t:T('The full real agent','पूरा साँचो एजेन्ट','完整的真正智能体'),local:1,code:`import anthropic
from datetime import datetime

client = anthropic.Anthropic()

def calculator(a, b):
    return a + b

def clock():
    return datetime.now().strftime("%H:%M")

tools = [
    {"name": "calculator", "description": "Add two numbers.",
     "input_schema": {"type": "object",
                      "properties": {"a": {"type": "number"}, "b": {"type": "number"}},
                      "required": ["a", "b"]}},
    {"name": "clock", "description": "Get the current time.",
     "input_schema": {"type": "object", "properties": {}}},
]

memory = []

def ask(question):
    memory.append({"role": "user", "content": question})
    while True:
        reply = client.messages.create(
            model="claude-sonnet-5-5",
            max_tokens=1000,
            tools=tools,
            messages=memory,
        )
        memory.append({"role": "assistant", "content": reply.content})
        if reply.stop_reason != "tool_use":
            return "".join(b.text for b in reply.content if b.type == "text")
        results = []
        for block in reply.content:
            if block.type == "tool_use":
                if block.name == "calculator":
                    out = calculator(block.input["a"], block.input["b"])
                else:
                    out = clock()
                results.append({"type": "tool_result",
                                "tool_use_id": block.id,
                                "content": str(out)})
        memory.append({"role": "user", "content": results})

while True:
    q = input("You: ")
    if q == "quit":
        break
    print("Agent:", ask(q))`,
  x:T(`<p>Save as <code>agent.py</code> and run <code>python agent.py</code>. Type questions; type <code>quit</code> to stop. Everything here is something you already learned:</p><ul><li><b>tools</b>: a list of dictionaries describing each tool, so Claude knows what it can use. <code>input_schema</code> says what inputs the tool needs.</li><li><b>memory</b>: the message list (Lesson 11).</li><li><b>the loop</b> <code>while True</code>: ask Claude. If Claude wants a tool (<code>stop_reason == "tool_use"</code>), run it, add the result to memory, and ask again. If not, return Claude's text answer. This is think → act → check, repeat.</li><li><code>input("You: ")</code> waits for you to type.</li></ul><p>Now Claude is the brain: it understands "what's twelve and thirty together?" without any keywords.</p>`,

  `<p>保存为 <code>agent.py</code>，然后运行 <code>python agent.py</code>。输入问题；输入 <code>quit</code> 退出。这里的每样东西你都已经学过了：</p><ul><li><b>tools</b>：描述每个工具的字典列表，让Claude知道它能用什么。<code>input_schema</code> 说明工具需要什么输入。</li><li><b>memory</b>：消息列表（第11课）。</li><li><b>循环</b> <code>while True</code>：问Claude。如果Claude要用工具（<code>stop_reason == "tool_use"</code>），就运行工具，把结果加进记忆，再问一次。否则就返回Claude的文字回答。这就是"思考 → 行动 → 检查，重复"。</li><li><code>input("You: ")</code> 等你输入。</li></ul><p>现在Claude就是大脑了：不需要关键词，它也能听懂"十二和三十合起来是多少？"。</p>`)},

const GRAPH_PRE=`class MiniGraph:
    def __init__(self):
        self.nodes = {}
        self.edges = {}

    def add_node(self, name, func):
        self.nodes[name] = func

    def add_edge(self, start, end):
        self.edges[start] = end

    def invoke(self, state):
        current = self.edges["START"]
        while current != "END":
            print("Running:", current)
            state = self.nodes[current](state)
            nxt = self.edges[current]
            current = nxt(state) if callable(nxt) else nxt
        return state`;

  x:T(`<ul><li><b>It predicts the next piece of text.</b> An LLM reads your words and guesses, very cleverly, what should come next, one <b>token</b> (a small piece of a word) at a time.</li><li><b>Context window</b>: how much text it can look at in one go, like the size of its desk. Everything it needs (instructions, memory, tool results) must fit on the desk.</li><li><b>Temperature</b>: a setting for creativity. Low = careful and repeatable. High = more creative and surprising.</li><li><b>Hallucination</b>: when the model says something false in a confident voice. This is why agents use tools (a calculator is never wrong about 2+2) and why we test them.</li><li><b>No built-in memory</b>: the model forgets everything between calls. Your code must send the history each time (Lesson 11).</li></ul>`,
  `<ul><li><b>यसले अर्को अक्षरको अनुमान गर्छ।</b> LLM ले तपाईंका शब्द पढ्छ र अब के आउनुपर्छ भनेर, एक-एक <b>टोकन</b> (शब्दको सानो टुक्रा) गर्दै, निकै चलाखीपूर्वक अनुमान गर्छ।</li><li><b>कन्टेक्स्ट विन्डो</b>: एकै पटकमा कति अक्षर हेर्न सक्छ, यसको टेबलको आकार जस्तै। चाहिने सबै कुरा (निर्देशन, मेमोरी, औजारको नतिजा) टेबलमा अटाउनुपर्छ।</li><li><b>टेम्परेचर</b>: सिर्जनशीलताको सेटिङ। कम = होसियार र उस्तै उत्तर। धेरै = बढी सिर्जनशील र अचम्मको।</li><li><b>ह्यालुसिनेसन</b>: मोडेलले विश्वासका साथ झुटो कुरा भन्नु। त्यसैले एजेन्टले औजार प्रयोग गर्छ (क्याल्कुलेटरले 2+2 मा कहिल्यै गल्ती गर्दैन) र त्यसैले हामी परीक्षण गर्छौँ।</li><li><b>आफ्नै मेमोरी हुँदैन</b>: मोडेलले हरेक कलबीच सबै बिर्सन्छ। तपाईंको कोडले हरेक पटक इतिहास पठाउनुपर्छ (पाठ ११)।</li></ul>`,
  `<ul><li><b>它在预测下一段文字。</b>大语言模型读你的话，然后非常聪明地猜接下来应该是什么，一次一个 <b>token</b>（一小块词）。</li><li><b>上下文窗口</b>：它一次能看多少文字，就像它书桌的大小。它需要的一切（指令、记忆、工具结果）都必须放得下。</li><li><b>温度（temperature）</b>：控制创造力的设置。低 = 谨慎、每次差不多。高 = 更有创意、更出人意料。</li><li><b>幻觉（hallucination）</b>：模型用很自信的语气说错话。这就是智能体要用工具（计算器算2+2永远不会错）、也要做测试的原因。</li><li><b>没有自带记忆</b>：每次调用之间模型什么都不记得。你的代码每次都要把历史发过去（第11课）。</li></ul>`)},

  x:T(`<p>In Lesson 12 you wrote the agent loop yourself: call the model, check for tool use, run the tool, send the result back, repeat. A <b>framework</b> like <b>LangChain</b> has that loop already written and tested, so you only describe your tools and instructions.</p><p>Its main pieces:</p><ul><li><code>@tool</code>: turns a normal Python function into a tool. The <b>docstring</b> (the text in triple quotes) tells the AI what the tool does.</li><li><code>create_agent(...)</code>: builds the agent from a model, tools and a system prompt.</li><li><code>agent.invoke(...)</code>: runs it.</li></ul><p>It also works with many AI companies, so you can switch models by changing one word.</p>`,
  `<p>पाठ १२ मा तपाईंले एजेन्ट लुप आफैँ लेख्नुभयो: मोडेललाई बोलाउने, औजार चाहियो कि हेर्ने, औजार चलाउने, नतिजा फिर्ता पठाउने, दोहोर्‍याउने। <b>LangChain</b> जस्तो <b>फ्रेमवर्क</b>मा त्यो लुप पहिले नै लेखिएको र परीक्षण गरिएको हुन्छ, त्यसैले तपाईंले आफ्ना औजार र निर्देशन मात्र बताउनुपर्छ।</p><p>यसका मुख्य भाग:</p><ul><li><code>@tool</code>: साधारण Python फङ्सनलाई औजार बनाउँछ। <b>docstring</b> (तीन उद्धरण चिह्नभित्रको अक्षर) ले औजारले के गर्छ भनेर AI लाई बताउँछ।</li><li><code>create_agent(...)</code>: मोडेल, औजार र सिस्टम प्रम्प्टबाट एजेन्ट बनाउँछ।</li><li><code>agent.invoke(...)</code>: त्यसलाई चलाउँछ।</li></ul><p>यो धेरै AI कम्पनीसँग चल्छ, त्यसैले एउटा शब्द बदलेर मोडेल फेर्न सकिन्छ।</p>`,
  `<p>在第12课里，你亲手写了智能体循环：调用模型、检查是否要用工具、运行工具、把结果发回去、重复。像 <b>LangChain</b> 这样的<b>框架</b>已经把这个循环写好并测试过了，你只需要描述你的工具和指令。</p><p>它的主要部分：</p><ul><li><code>@tool</code>：把普通的Python函数变成工具。<b>文档字符串（docstring）</b>（三引号里的文字）告诉AI这个工具是做什么的。</li><li><code>create_agent(...)</code>：用模型、工具和系统提示词搭建智能体。</li><li><code>agent.invoke(...)</code>：运行它。</li></ul><p>它支持很多AI公司的模型，改一个词就能换模型。</p>`)},

    def invoke(question):
        q = question.lower()
        for name, func in tools.items():
            if name.split("_")[1] in q:
                city = question.split()[-1].strip("?")
                return func(city)
        return "Sorry, I have no tool for that."
    return invoke

  x:T(`<p>Imagine an airport. Before you board (before the step), security checks your bag. After you land (after the step), customs checks again. <b>Middleware</b> is the same for agents. Common uses:</p><ul><li><b>Logging</b>: write down every step so you can see what happened.</li><li><b>Limits</b>: stop after too many tool calls so it does not loop forever or spend too much money.</li><li><b>Summarizing</b>: shorten old messages when the context window gets full.</li><li><b>Safety</b>: block bad inputs, hide private data.</li><li><b>Human approval</b>: pause and ask a person before an important action.</li></ul><p>In LangChain, the main hook points are <code>before_model</code>, <code>after_model</code> and <code>wrap_tool_call</code>.</p>`,

from langchain.agents.middleware import before_model, wrap_tool_call
from langchain.tools import tool

@tool
def get_weather(city: str) -> str:
    """Get the weather for a city."""
    return f"It is sunny in {city}."

@before_model
def show_count(state, runtime):
    print("Messages so far:", len(state["messages"]))
    return None

@wrap_tool_call
def log_tool(request, handler):
    print("Running tool:", request.tool_call["name"])
    return handler(request)

agent = create_agent(
    model="anthropic:claude-sonnet-5-5",
    tools=[get_weather],
    middleware=[show_count, log_tool],
)

 {t:T('The real LangGraph','साँचो LangGraph','真正的 LangGraph'),local:1,code:`from typing import Literal
from typing_extensions import TypedDict
from langgraph.graph import StateGraph, START, END

class State(TypedDict):
    n: int
    label: str

def double(state: State) -> dict:
    return {"n": state["n"] * 2}

def label_big(state: State) -> dict:
    return {"label": "big"}

def route(state: State) -> Literal["label_big", "__end__"]:
    return "label_big" if state["n"] > 10 else END

builder = StateGraph(State)
builder.add_node("double", double)
builder.add_node("label_big", label_big)
builder.add_edge(START, "double")
builder.add_conditional_edges("double", route)
builder.add_edge("label_big", END)

graph = builder.compile()
print(graph.invoke({"n": 7, "label": ""}))`,

  x:T(`<p><b>Risks:</b> wrong answers (hallucination), wrong actions (booking the wrong day), privacy leaks, unfair treatment of some people (bias), people tricking the agent with hidden instructions (prompt injection), and high costs.</p><p><b>Good rules (governance):</b></p><ul><li><b>Least power</b>: give the agent only the tools it really needs.</li><li><b>Human in the loop</b> for anything important or hard to undo.</li><li><b>Guardrails</b>: automatic checks that block risky actions.</li><li><b>Audit log</b>: a record of every action, to check later.</li><li><b>Evaluation</b>: test the agent with known questions before and after changes.</li><li><b>Privacy</b>: collect only needed data, hide it in logs, follow local law.</li><li><b>Honesty</b>: tell people they are talking to an AI.</li></ul>`,
  `<p><b>जोखिम:</b> गलत उत्तर (ह्यालुसिनेसन), गलत काम (गलत दिन बुक गर्नु), निजी जानकारी चुहिनु, केही मान्छेमाथि अन्यायपूर्ण व्यवहार (पूर्वाग्रह/bias), लुकेका निर्देशनले एजेन्टलाई झुक्याउनु (प्रम्प्ट इन्जेक्सन), र धेरै खर्च।</p><p><b>राम्रा नियम (सुशासन):</b></p><ul><li><b>न्यूनतम शक्ति</b>: एजेन्टलाई साँच्चै चाहिने औजार मात्र दिने।</li><li>महत्त्वपूर्ण वा फर्काउन गाह्रो कामका लागि <b>Human in the loop</b>।</li><li><b>गार्डरेल</b>: जोखिमपूर्ण काम रोक्ने स्वचालित जाँच।</li><li><b>अडिट लग</b>: पछि जाँच्न हरेक कामको रेकर्ड।</li><li><b>मूल्याङ्कन</b>: परिवर्तनअघि र पछि थाहा भएका प्रश्नले एजेन्टको परीक्षण।</li><li><b>गोपनीयता</b>: चाहिने डाटा मात्र लिने, लगमा लुकाउने, स्थानीय कानुन मान्ने।</li><li><b>इमानदारी</b>: मान्छेलाई AI सँग कुरा गर्दैछु भनेर थाहा दिने।</li></ul>`,
  `<p><b>风险：</b>答错（幻觉）、做错事（订错日子）、隐私泄露、对某些人不公平（偏见）、有人用隐藏的指令骗智能体（提示词注入），以及费用过高。</p><p><b>好的规则（治理）：</b></p><ul><li><b>最小权限</b>：只给智能体它真正需要的工具。</li><li>重要或难以撤销的操作要<b>人在回路中</b>。</li><li><b>护栏（guardrail）</b>：自动拦截有风险操作的检查。</li><li><b>审计日志</b>：记录每一个操作，方便事后检查。</li><li><b>评估</b>：在修改前后，用已知答案的问题测试智能体。</li><li><b>隐私</b>：只收集必要的数据，在日志里隐藏，遵守当地法律。</li><li><b>诚实</b>：告诉人们他们在和AI对话。</li></ul>`)},

from langchain.agents.middleware import HumanInTheLoopMiddleware
from langchain.tools import tool
from langgraph.checkpoint.memory import InMemorySaver
from langgraph.types import Command

slots = {"Dr. Rai": ["Mon 10:00", "Mon 11:00"], "Dr. Chen": ["Tue 09:00"]}

@tool
def list_slots() -> str:
    """List the free appointment times for every doctor."""
    return "\\n".join(f"{d}: {', '.join(t)}" for d, t in slots.items())

@tool
def book_appointment(name: str, doctor: str, time: str) -> str:
    """Book a free time with a doctor for a patient."""
    if time in slots.get(doctor, []):
        slots[doctor].remove(time)
        return f"Booked {name} with {doctor} at {time}"
    return "That time is not free"

agent = create_agent(
    model="anthropic:claude-sonnet-5-5",
    tools=[list_slots, book_appointment],
    system_prompt=(
        "You help patients book clinic appointments. "
        "You never give medical advice. "
        "If someone describes an emergency, tell them to call emergency services now."
    ),
    middleware=[HumanInTheLoopMiddleware(interrupt_on={"book_appointment": True})],
    checkpointer=InMemorySaver(),
)

config = {"configurable": {"thread_id": "patient-asha"}}
agent.invoke(
    {"messages": [{"role": "user", "content": "Please book Asha with Dr. Rai on Mon 10:00"}]},
    config,
)

result = agent.invoke(Command(resume={"decisions": [{"type": "approve"}]}), config)
print(result["messages"][-1].content)`,

  `<p>राम्रो प्रम्प्ट राम्रो कामको विवरण जस्तै हो। यी ५ भाग प्रयोग गर्नुहोस्:</p><ul><li><b>भूमिका</b>: एजेन्ट को हो। "तिमी धैर्यवान Python शिक्षक हौ।"</li><li><b>लक्ष्य</b>: सफलता कस्तो देखिन्छ। "सुरुआतीलाई एक पटकमा एउटा कुरा बुझ्न मद्दत गर।"</li><li><b>नियम</b>: सधैँ के गर्ने वा कहिल्यै के नगर्ने। "सजिला शब्द प्रयोग गर। कहिल्यै तथ्य नबनाऊ।"</li><li><b>उदाहरण</b>: उत्तम उत्तरसहित १–३ नमुना प्रश्न। यसलाई <b>few-shot</b> प्रम्प्टिङ भनिन्छ र यो धेरै राम्रोसँग काम गर्छ।</li><li><b>उत्तरको ढाँचा</b>: उत्तर कस्तो देखिनुपर्छ। "३ छोटा बुँदामा उत्तर देऊ।"</li></ul><p>नराम्रो प्रम्प्ट: "python मा मद्दत गर"। राम्रो प्रम्प्ट: सबै ५ भाग। उही AI ले धेरै राम्रो उत्तर दिन्छ।</p>`,
  `<p>好的提示词就像一份好的岗位说明。用这5个部分：</p><ul><li><b>角色</b>：智能体是谁。"你是一位耐心的Python老师。"</li><li><b>目标</b>：怎样才算成功。"帮助初学者一次理解一个概念。"</li><li><b>规则</b>：必须做什么、绝不能做什么。"用简单的词。绝不编造事实。"</li><li><b>示例</b>：1–3个带有完美答案的示范问题。这叫<b>少样本（few-shot）</b>提示，效果非常好。</li><li><b>输出格式</b>：回答应该是什么样子。"用3个简短的要点回答。"</li></ul><p>差的提示词："帮我学python"。好的提示词：5个部分都有。同一个AI会给出好得多的回答。</p>`)},
 {t:T('Build a prompt with code','कोडबाट प्रम्प्ट बनाउनुहोस्','用代码组合提示词'),code:`def build_prompt(role, rules, examples, question):
    text = f"You are {role}.\\n"
    text += "Rules:\\n"
    for r in rules:
        text += f"- {r}\\n"
    text += "Examples:\\n"
    for q, a in examples:
        text += f"Q: {q}\\nA: {a}\\n"
    text += f"Q: {question}\\nA:"
    return text

prompt = build_prompt(
    "a patient Python tutor",
    ["Use simple words", "Give one short example"],
    [("What is a list?", "A list keeps many items in order, like [1, 2, 3].")],
    "What is a dictionary?",
)
print(prompt)`,out:`You are a patient Python tutor.

 {t:T('Retry when the network fails','नेटवर्क असफल हुँदा फेरि प्रयास','网络失败时重试'),code:`attempts = {"n": 0}

def flaky_weather(city):
    attempts["n"] = attempts["n"] + 1
    if attempts["n"] < 3:
        raise ConnectionError("network busy")
    return f"Sunny in {city}"

def with_retry(func, arg, tries=3):
    for i in range(1, tries + 1):
        try:
            return func(arg)
        except ConnectionError as e:
            print("Try", i, "failed:", e)
    return f"Gave up after {tries} tries"

print(with_retry(flaky_weather, "Halifax"))`,out:`Try 1 failed: network busy
Try 2 failed: network busy

  `<ul><li><code>raise</code> ले जानीजानी त्रुटि बनाउँछ। यहाँ इन्टरनेट दुई पटक असफल भएको नाटक गरिएको छ।</li><li><code>range(1, tries + 1)</code> ले 1, 2, 3 गन्छ।</li><li><code>except ConnectionError as e</code> ले त्रुटि समातेर त्यसको सन्देश <code>e</code> मा राख्छ।</li></ul><p>साँचो सेवा कहिलेकाहीँ एकछिनका लागि असफल हुन्छन्। फेरि प्रयास (<b>retry</b>) गर्दा यस्ता धेरैजसो समस्या सुल्झिन्छन्।</p>`,
  `<ul><li><code>raise</code> 故意制造一个错误。这里我们假装网络失败了两次。</li><li><code>range(1, tries + 1)</code> 依次数 1、2、3。</li><li><code>except ConnectionError as e</code> 捕获错误，并把错误信息存在 <code>e</code> 里。</li></ul><p>真实的服务有时会短暂失败。再试一次（<b>重试</b>）就能解决大多数这类问题。</p>`)}

 {t:T('Retrieve → Augment → Generate','खोज → थप → उत्तर','检索 → 增强 → 生成'),
  x:T(`<p><b>RAG</b> stands for Retrieval-Augmented Generation. Three simple steps:</p><ul><li><b>Retrieve</b>: search your own documents for the part that matches the question.</li><li><b>Augment</b>: add that part to the prompt: "Use only this information…".</li><li><b>Generate</b>: the AI writes the answer using it.</li></ul><p>This makes answers <b>correct and up to date</b>, and greatly reduces made-up answers. Most business agents (help desks, company assistants) use RAG.</p>`,
  `<p><b>RAG</b> को पूरा रूप Retrieval-Augmented Generation हो। तीन सजिला चरण:</p><ul><li><b>खोज (Retrieve)</b>: प्रश्नसँग मिल्ने भाग आफ्नै कागजातमा खोज्ने।</li><li><b>थप (Augment)</b>: त्यो भाग प्रम्प्टमा थप्ने: "यही जानकारी मात्र प्रयोग गर…"।</li><li><b>उत्तर (Generate)</b>: त्यसैको आधारमा AI ले उत्तर लेख्छ।</li></ul><p>यसले उत्तरलाई <b>सही र अद्यावधिक</b> बनाउँछ, र बनावटी उत्तर धेरै घटाउँछ। धेरैजसो व्यवसायिक एजेन्ट (हेल्प डेस्क, कम्पनी सहायक) ले RAG प्रयोग गर्छन्।</p>`,
  `<p><b>RAG</b> 是 Retrieval-Augmented Generation（检索增强生成）的缩写。三个简单步骤：</p><ul><li><b>检索</b>：在你自己的文档里找出和问题相关的部分。</li><li><b>增强</b>：把这部分加进提示词："只用以下信息回答……"。</li><li><b>生成</b>：AI根据这些信息写出答案。</li></ul><p>这样答案会<b>正确而且最新</b>，编造的情况也大大减少。大多数企业智能体（客服、公司助手）都在用RAG。</p>`)},
 {t:T('Retrieve: find the best document','खोज: सबैभन्दा मिल्ने कागजात फेला पार्नुहोस्','检索：找到最相关的文档'),code:`docs = [
    "Our shop opens at 9 am and closes at 6 pm, Monday to Saturday.",
    "Returns are free within 30 days if you keep the receipt.",
    "We deliver to Halifax and Dartmouth in 2 days.",
]
STOP = {"the", "a", "is", "do", "does", "i", "can", "when", "what", "you", "to", "my"}

def words(text):
    clean = text.lower().replace("?", "").replace(",", "").replace(".", "")
    return [w for w in clean.split() if w not in STOP]

def score(question, doc):
    total = 0
    for q in words(question):
        for d in words(doc):
            if d.startswith(q):
                total = total + 1
    return total

def retrieve(question):
    return max(docs, key=lambda d: score(question, d))

print(retrieve("When does the shop open?"))
print(retrieve("Can I return a jacket?"))`,out:`Our shop opens at 9 am and closes at 6 pm, Monday to Saturday.
Returns are free within 30 days if you keep the receipt.`,
  x:T(`<ul><li><code>STOP</code> is a <b>set</b> of small common words to ignore. A set is like a list with no repeats, written with <code>{ }</code>.</li><li><code>[w for w in ... if ...]</code> is a <b>list comprehension</b>: a one-line loop that builds a new list.</li><li><code>score</code> counts matching words. <code>startswith</code> lets "open" match "opens".</li><li><code>max(docs, key=...)</code> picks the document with the highest score. <code>lambda d: ...</code> is a tiny one-line function.</li></ul><p>Experts use <b>embeddings</b> instead: numbers that capture meaning, so "jacket" can match "clothes". The idea is the same.</p>`,
  `<ul><li><code>STOP</code> बेवास्ता गर्ने साना सामान्य शब्दहरूको <b>सेट (set)</b> हो। सेट भनेको नदोहोरिने सूची जस्तै हो, <code>{ }</code> ले लेखिन्छ।</li><li><code>[w for w in ... if ...]</code> <b>लिस्ट कम्प्रिहेन्सन</b> हो: नयाँ सूची बनाउने एक लाइनको लुप।</li><li><code>score</code> ले मिल्ने शब्द गन्छ। <code>startswith</code> ले "open" लाई "opens" सँग मिलाउँछ।</li><li><code>max(docs, key=...)</code> ले सबैभन्दा धेरै अङ्क पाउने कागजात छान्छ। <code>lambda d: ...</code> सानो एक लाइनको फङ्सन हो।</li></ul><p>विशेषज्ञहरू यसको सट्टा <b>इम्बेडिङ</b> प्रयोग गर्छन्: अर्थ समेट्ने संख्याहरू, ताकि "jacket" लाई "clothes" सँग मिलाउन सकियोस्। विचार उही हो।</p>`,
  `<ul><li><code>STOP</code> 是一个要忽略的常见小词的<b>集合（set）</b>。集合像不重复的列表，用 <code>{ }</code> 写。</li><li><code>[w for w in ... if ...]</code> 是<b>列表推导式</b>：一行写完的循环，用来生成新列表。</li><li><code>score</code> 数一数有多少词匹配。<code>startswith</code> 让"open"也能匹配"opens"。</li><li><code>max(docs, key=...)</code> 选出得分最高的文档。<code>lambda d: ...</code> 是一个一行的小函数。</li></ul><p>专家会用<b>嵌入向量（embedding）</b>：一组能表达意思的数字，这样"jacket（夹克）"也能匹配"clothes（衣服）"。思路是一样的。</p>`)},

 {t:T('Generate: the real RAG agent','उत्तर: साँचो RAG एजेन्ट','生成：真正的RAG智能体'),local:1,code:`import anthropic

client = anthropic.Anthropic()

docs = [
    "Our shop opens at 9 am and closes at 6 pm, Monday to Saturday.",
    "Returns are free within 30 days if you keep the receipt.",
    "We deliver to Halifax and Dartmouth in 2 days.",
]

def retrieve(question):
    q = set(question.lower().split())
    return max(docs, key=lambda d: len(q & set(d.lower().split())))

def answer(question):
    context = retrieve(question)
    reply = client.messages.create(
        model="claude-sonnet-5-5",
        max_tokens=300,
        system="Answer using only the given information. If it is not there, say you do not know.",
        messages=[{"role": "user", "content": f"Information: {context}\\n\\nQuestion: {question}"}],
    )
    return reply.content[0].text

def search_notes(keyword: str) -> str:
    """Search the text files in the notes folder for a keyword and return matching lines with the file name."""
    hits = []
    for f in Path("notes").glob("*.txt"):
        for line in f.read_text(encoding="utf-8").splitlines():
            if keyword.lower() in line.lower():
                hits.append(f"{line} [source: {f.name}]")
    return "\\n".join(hits) or "Nothing found."

    ),

G('Framework','फ्रेमवर्क','框架','A big ready-made kit of code that does the common work for you, so you only write the parts that are special to your project.','तपाईंका लागि सामान्य काम गरिदिने तयारी कोडको ठूलो किट, ताकि तपाईंले आफ्नो प्रोजेक्टका विशेष भाग मात्र लेख्नुपरोस्।','一大套现成的代码工具包，帮你完成常见的工作，你只需要写自己项目特有的部分。'),
G('LangChain','LangChain','LangChain','A popular Python framework for building AI agents: tools, models, middleware and create_agent in one kit.','AI एजेन्ट बनाउने लोकप्रिय Python फ्रेमवर्क: औजार, मोडेल, मिडलवेयर र create_agent एउटै किटमा।','一个流行的Python智能体开发框架：工具、模型、中间件和 create_agent 都在一个工具包里。'),
G('LangGraph','LangGraph','LangGraph','A framework for building agents as graphs (maps of steps) with nodes, edges and shared state. Good for loops, teams and pausing for humans.','एजेन्टलाई नोड, एज र साझा स्टेटसहितको ग्राफ (चरणहरूको नक्सा) को रूपमा बनाउने फ्रेमवर्क। लुप, टोली र मान्छेका लागि रोक्न राम्रो।','用"图"（步骤地图）来搭建智能体的框架，有节点、边和共享状态。适合做循环、团队协作和暂停等人确认。'),
G('Middleware','मिडलवेयर','中间件','Code that runs before or after each step of an agent, like a checkpoint: logging, limits, safety checks, human approval.','एजेन्टको हरेक चरणअघि वा पछि चल्ने कोड, जाँच-चौकी जस्तै: रेकर्ड, सीमा, सुरक्षा जाँच, मानिसको स्वीकृति।','在智能体每一步之前或之后运行的代码，像检查站：记录日志、限制次数、安全检查、人工审批。'),
G('Decorator (@)','डेकोरेटर (@)','装饰器（@）','A line starting with @ above a function. It passes the function through another function to add extra behaviour, like @tool.','फङ्सनमाथि @ बाट सुरु हुने लाइन। यसले थप व्यवहार थप्न फङ्सनलाई अर्को फङ्सनबाट पार गराउँछ, जस्तै @tool।','写在函数上方、以 @ 开头的一行。它让这个函数经过另一个函数处理，以增加额外功能，比如 @tool。'),
G('Docstring','डकस्ट्रिङ (docstring)','文档字符串','Text in triple quotes right under a def line that explains what the function does. AI agents read it to understand tools.','def लाइनको ठीक तल तीन उद्धरण चिह्नभित्र लेखिएको, फङ्सनले के गर्छ भनेर बताउने अक्षर। औजार बुझ्न AI एजेन्टले यही पढ्छ।','写在 def 行下面、用三引号括起来的说明文字，解释函数的作用。AI智能体靠读它来理解工具。'),
G('Type hint','टाइप हिन्ट','类型提示','A label like city: str or -> int that says what kind of data is expected. Python does not force it, but tools like LangChain read it.','city: str वा -> int जस्तो लेबल, जसले कस्तो डाटा अपेक्षित छ भन्छ। Python ले जबरजस्ती गर्दैन, तर LangChain जस्ता औजारले पढ्छन्।','像 city: str 或 -> int 这样的标注，说明需要什么类型的数据。Python不会强制检查，但LangChain等工具会读取它。'),
G('Node / edge / state','नोड / एज / स्टेट','节点 / 边 / 状态','In a graph: a node is one step, an edge is the path to the next step, and the state is the shared data every step can read and update.','ग्राफमा: नोड एउटा चरण, एज अर्को चरणसम्मको बाटो, र स्टेट हरेक चरणले पढ्न र अद्यावधिक गर्न सक्ने साझा डाटा हो।','在图里：节点是一个步骤，边是通往下一步的路，状态是每一步都能读取和更新的共享数据。'),
G('Conditional edge / routing','सर्तसहितको एज / रुटिङ','条件边 / 路由','A crossroads in a graph: a small function looks at the state and decides which step comes next.','ग्राफको चौबाटो: सानो फङ्सनले स्टेट हेरेर अर्को चरण कुन हो तय गर्छ।','图中的十字路口：一个小函数查看状态，决定下一步走哪里。'),
G('Checkpointer','चेकपोइन्टर','检查点保存器','Something that saves the agent’s state after each step, like saving a game, so it can remember conversations and resume after a pause.','हरेक चरणपछि एजेन्टको स्टेट सेभ गर्ने चीज, गेम सेभ गरे जस्तै, ताकि कुराकानी याद राख्न र रोकाइपछि अगाडि बढ्न सकोस्।','在每一步之后保存智能体状态的东西，像游戏存档，让它能记住对话、暂停后继续。'),
G('Thread / thread_id','थ्रेड / thread_id','线程 / thread_id','One separate conversation. The thread_id is its name, so each user’s memory stays apart.','एउटा छुट्टै कुराकानी। thread_id त्यसको नाम हो, ताकि हरेक प्रयोगकर्ताको मेमोरी छुट्टै रहोस्।','一段独立的对话。thread_id 是它的名字，让每个用户的记忆分开保存。'),
G('Human in the loop (HITL)','ह्युमन इन द लुप (HITL)','人在回路中（HITL）','A person must approve, edit or reject important actions before the agent does them.','एजेन्टले महत्त्वपूर्ण काम गर्नुअघि मान्छेले स्वीकृति, सम्पादन वा अस्वीकार गर्नैपर्छ।','智能体执行重要操作之前，必须由人批准、修改或拒绝。'),
G('Interrupt','इन्टरप्ट','中断（interrupt）','A pause in a LangGraph run that waits for a human answer, then continues with Command(resume=...).','LangGraph चलिरहँदा मान्छेको उत्तर पर्खने रोकाइ, त्यसपछि Command(resume=...) ले अगाडि बढ्छ।','LangGraph运行中的一次暂停，等待人的回答，然后用 Command(resume=...) 继续。'),
G('Multi-agent system / supervisor','बहु-एजेन्ट प्रणाली / सुपरभाइजर','多智能体系统 / 主管','A team of agents. The supervisor reads each task and sends it to the right specialist agent.','एजेन्टहरूको टोली। सुपरभाइजरले हरेक काम पढेर सही विशेषज्ञ एजेन्टकहाँ पठाउँछ।','由多个智能体组成的团队。主管读懂每个任务，把它交给合适的专家智能体。'),
G('Subagent','सब-एजेन्ट','子智能体','A helper agent the main agent sends off to do one part of a job with a clean memory. It returns a short report.','मुख्य एजेन्टले सफा मेमोरीसहित कामको एउटा भाग गर्न पठाउने सहयोगी एजेन्ट। यसले छोटो रिपोर्ट फर्काउँछ।','主智能体派出去、带着干净记忆完成一部分工作的助手智能体。它会交回一份简短报告。'),
G('Deep agent','डिप एजेन्ट','深度智能体','An agent built for long, complex tasks: it plans with a to-do list, keeps notes in files and uses subagents.','लामो, जटिल कामका लागि बनाइएको एजेन्ट: कामको सूचीले योजना बनाउँछ, फाइलमा नोट राख्छ र सब-एजेन्ट प्रयोग गर्छ।','为长而复杂的任务设计的智能体：用待办清单做计划、在文件里记笔记，并使用子智能体。'),
G('Context window','कन्टेक्स्ट विन्डो','上下文窗口','How much text an AI model can look at in one go: instructions, history and tool results must all fit.','AI मोडेलले एकै पटकमा हेर्न सक्ने अक्षरको मात्रा: निर्देशन, इतिहास र औजारका नतिजा सबै अटाउनुपर्छ।','AI模型一次能看到的文字量：指令、历史和工具结果都必须放得下。'),
G('Temperature','टेम्परेचर','温度（temperature）','A setting for how creative or random the AI’s answers are. Low = steady, high = creative.','AI का उत्तर कति सिर्जनशील वा अनियमित हुन्छन् भन्ने सेटिङ। कम = स्थिर, धेरै = सिर्जनशील।','控制AI回答有多大创意或随机性的设置。低 = 稳定，高 = 有创意。'),
G('Hallucination','ह्यालुसिनेसन','幻觉','When an AI states something false as if it were true. Tools, sources and tests help reduce it.','AI ले झुटो कुरालाई साँचो जस्तो गरी भन्नु। औजार, स्रोत र परीक्षणले यसलाई घटाउन मद्दत गर्छन्।','AI把错误的内容当成事实说出来。工具、资料来源和测试可以帮助减少这种情况。'),
G('Structured output','संरचित आउटपुट','结构化输出','An AI answer in a fixed shape, such as JSON with set keys, so code can use it reliably.','तोकिएको ढाँचामा AI को उत्तर, जस्तै निश्चित key भएको JSON, ताकि कोडले भरपर्दो तरिकाले प्रयोग गर्न सकोस्।','按固定格式给出的AI回答，比如带指定键的JSON，方便代码可靠地使用。'),
G('Guardrail','गार्डरेल','护栏（guardrail）','An automatic check that blocks or flags risky inputs or actions.','जोखिमपूर्ण इनपुट वा कामलाई रोक्ने वा चिन्ह लगाउने स्वचालित जाँच।','自动拦截或标记有风险的输入或操作的检查。'),
G('Audit log','अडिट लग','审计日志','A record of every action the agent took, kept so people can check it later.','एजेन्टले गरेका हरेक कामको रेकर्ड, पछि मान्छेले जाँच्न सकून् भनेर राखिएको।','智能体做过的每个操作的记录，保存下来供人们事后检查。'),
G('Evaluation (evals)','मूल्याङ्कन (evals)','评估（evals）','Testing an agent with questions whose right answers you know, to measure how well it works.','सही उत्तर थाहा भएका प्रश्नले एजेन्टको परीक्षण गरेर ऊ कति राम्रो काम गर्छ नाप्नु।','用已知正确答案的问题测试智能体，衡量它的表现好坏。'),
G('Prompt injection','प्रम्प्ट इन्जेक्सन','提示词注入','A trick where hidden instructions inside a web page, email or file try to make an agent do something it should not.','वेब पेज, इमेल वा फाइलभित्र लुकाइएका निर्देशनले एजेन्टलाई नगर्नुपर्ने काम गराउन खोज्ने छल।','把指令藏在网页、邮件或文件里，试图让智能体做不该做的事情的骗术。'),
G('Governance','सुशासन (गभर्नेन्स)','治理','The rules, roles and checks an organisation uses to make sure AI is used safely, fairly and legally.','AI सुरक्षित, न्यायपूर्ण र कानुनी रूपमा प्रयोग भएको सुनिश्चित गर्न संस्थाले प्रयोग गर्ने नियम, भूमिका र जाँच।','组织为确保AI被安全、公平、合法地使用而制定的规则、职责和检查。')
);

GLOSS.push(
G('Prompt engineering','प्रम्प्ट इन्जिनियरिङ','提示词工程','The skill of writing instructions that get the best answers from an AI: role, goal, rules, examples and output format.','AI बाट सबैभन्दा राम्रो उत्तर पाउने निर्देशन लेख्ने सीप: भूमिका, लक्ष्य, नियम, उदाहरण र उत्तरको ढाँचा।','写出能让AI给出最好回答的指令的技巧：角色、目标、规则、示例和输出格式。'),
G('Few-shot examples','फ्यु-सट उदाहरण','少样本示例','A few sample questions with perfect answers placed in the prompt, so the AI copies the style.','प्रम्प्टमा राखिएका उत्तम उत्तरसहितका केही नमुना प्रश्न, ताकि AI ले त्यही शैली अपनाओस्।','放在提示词里的几个带完美答案的示范问题，让AI模仿这种风格。'),
G('try / except','try / except','try / except','Python words for "try this, and if an error happens, do this instead of crashing".','"यो प्रयास गर, त्रुटि भए क्र्यास हुनुको सट्टा यो गर" भन्ने Python शब्द।','Python里表示"试着做这个，如果出错，就改做那个而不是崩溃"的关键词。'),
G('Validation','भ्यालिडेसन','输入验证','Checking that inputs make sense before using them, for example that a number of people is at least 1.','प्रयोग गर्नुअघि इनपुट उचित छन् कि जाँच्नु, जस्तै मान्छेको संख्या कम्तीमा १ छ कि।','在使用输入之前先检查它是否合理，比如人数至少是1。'),
G('Retry','रिट्राई (फेरि प्रयास)','重试','Trying an action again after a short failure, such as a busy network.','छोटो असफलतापछि, जस्तै नेटवर्क व्यस्त हुँदा, काम फेरि प्रयास गर्नु।','在短暂失败（比如网络繁忙）之后再试一次。'),
G('RAG (Retrieval-Augmented Generation)','RAG','RAG（检索增强生成）','Search your own documents, add the best match to the prompt, then let the AI answer. Like an open-book exam.','आफ्नै कागजात खोज्ने, सबैभन्दा मिल्ने भाग प्रम्प्टमा थप्ने, अनि AI लाई उत्तर दिन लगाउने। खुला-किताब परीक्षा जस्तै।','先搜索你自己的文档，把最相关的内容加进提示词，再让AI回答。就像开卷考试。'),
G('Embedding','इम्बेडिङ','嵌入向量','A list of numbers that captures the meaning of a text, so similar meanings get similar numbers. Used for smart search.','अक्षरको अर्थ समेट्ने संख्याहरूको सूची, ताकि मिल्दो अर्थले मिल्दो संख्या पाओस्। स्मार्ट खोजका लागि प्रयोग हुन्छ।','一串能表示文字意思的数字，意思相近的文字数字也相近。用于智能搜索。'),

};
const bgUrl=id=>BG[id]?`url("data:image/svg+xml,${encodeURIComponent(BG[id]())}")`:'none';
let bgCache={};
function applyBg(){
 const st=store.get('bg')||{type:'plain'},layer=document.getElementById('bgLayer'),root=document.documentElement;
 layer.style.backgroundImage='none';layer.style.backgroundColor='';
 if(st.type==='design'&&BG[st.id]){layer.style.backgroundImage=bgCache[st.id]||(bgCache[st.id]=bgUrl(st.id))}
 else if(st.type==='color'){layer.style.backgroundColor=st.v}
 else if(st.type==='image'&&(st.v||window.__bgImg)){layer.style.backgroundImage=`url("${st.v||window.__bgImg}")`}
 root.classList.toggle('has-bg',st.type!=='plain'&&!(st.type==='image'&&!(st.v||window.__bgImg)));
 const veil=store.get('veil')||88;root.style.setProperty('--veilp',veil+'%');document.getElementById('bgVeil').value=veil;
 for(const b of document.querySelectorAll('#swatches button'))b.setAttribute('aria-pressed',(st.type==='plain'&&b.dataset.bg==='plain')||(st.type==='design'&&st.id===b.dataset.bg));
}
function renderSwatches(){
 document.getElementById('swatches').innerHTML=Object.keys(BGNAMES).map(id=>`<button data-bg="${id}" aria-pressed="false"><i style='background:${id==='plain'?'var(--bg)':(bgCache[id]||(bgCache[id]=bgUrl(id)))};background-size:cover'></i><span>${esc(L(BGNAMES[id]))}</span></button>`).join('');
 applyBg();
}
const panel=document.getElementById('bgPanel'),bgBtn=document.getElementById('bgBtn');
const openPanel=o=>{panel.hidden=!o;bgBtn.setAttribute('aria-expanded',o);if(o)panel.querySelector('button')?.focus();else bgBtn.focus()};
bgBtn.addEventListener('click',()=>openPanel(panel.hidden));
document.getElementById('bgClose').addEventListener('click',()=>openPanel(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)openPanel(false)});
document.getElementById('swatches').addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(!b)return;store.set('bg',b.dataset.bg==='plain'?{type:'plain'}:{type:'design',id:b.dataset.bg});applyBg()});
document.getElementById('bgColor').addEventListener('input',e=>{store.set('bg',{type:'color',v:e.target.value});applyBg()});
document.getElementById('bgVeil').addEventListener('input',e=>{store.set('veil',+e.target.value);applyBg()});
document.getElementById('bgReset').addEventListener('click',()=>{store.set('bg',{type:'plain'});store.set('veil',88);document.getElementById('bgMsg').textContent='';applyBg()});
document.getElementById('bgFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,1920/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',.82);window.__bgImg=data;let saved=false;
  try{localStorage.setItem('agentschool.bg',JSON.stringify({type:'image',v:data}));saved=true}catch(err){}
  if(!saved)store.set('bg',{type:'image'});
  document.getElementById('bgMsg').textContent=saved?'':L(UI.bgBig);applyBg()};img.src=rd.result};rd.readAsDataURL(f)});

const K='#141414',Y='#ffe600',C='#d8d8d4',Wt='#ffffff',Bl='#5b8def',Rd='#ef6f53',Gr='#3cb371',Pu='#b388eb',Or='#ffa94d',Gy='#9a9a94';

const bars=(x,y,n,w,c=Gy,gap=12)=>{let s='';for(let i=0;i<n;i++)s+=`<rect x="${x}" y="${y+i*gap}" width="${w*(1-(i%3)*.22)}" height="6" rx="3" fill="${c}"/>`;return s};

 <polygon points="${x},${y} ${x+d},${y-d} ${x+w+d},${y-d} ${x+w},${y}" fill="${top}" stroke="#141414" stroke-width="2"/>
 <polygon points="${x+w},${y} ${x+w+d},${y-d} ${x+w+d},${y+h-d} ${x+w},${y+h}" fill="${side}" stroke="#141414" stroke-width="2"/>
 <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${front}" stroke="#141414" stroke-width="2"/>
 <text x="${x+w/2}" y="${y+h/2-2}" text-anchor="middle" font-size="22" font-weight="700" fill="#141414" data-p="${id}"></text>
 <text x="${x+w/2}" y="${y+h/2+20}" text-anchor="middle" font-size="13" fill="#141414" data-p="${sub}"></text></g>`;
}
